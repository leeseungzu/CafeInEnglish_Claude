 "p": "/p/email-phrases/"}, {"en": "That sounds really tough.", "ko": "정말 힘들었겠다", "a": "/audio/b4318a8188e1.mp3", "p": "/p/sorry-to-hear/"}, {"en": "We're all in on this project.", "ko": "우리 이 프로젝트에 올인했어", "a": "/audio/c486dcdd7a73.mp3", "p": "/p/lee-chey-gala-speech/"}, {"en": "Please raise your glass to our team!", "ko": "우리 팀을 위해 건배해요!", "a": "/audio/02c5c1fcd34a.mp3", "p": "/p/lee-chey-gala-speech/"}, {"en": "The view took my breath away.", "ko": "경치가 숨이 멎을 만큼 멋졌어요", "a": "/audio/ce912a409069.mp3", "p": "/p/jensen-van-fleet-speech/"}, {"en": "Could somebody pass me the salt?", "ko": "누가 소금 좀 건네주실래요?", "a": "/audio/01e0b9697a77.mp3", "p": "/p/jensen-van-fleet-speech/"}, {"en": "I put in 30 minutes every morning.", "ko": "매일 아침 30분씩 들여요", "a": "/audio/f0b543404e92.mp3", "p": "/p/duolingo-500-hours/"}, {"en": "Small goals keep me motivated.", "ko": "작은 목표가 저를 계속 움직이게 해요", "a": "/audio/33e5ff932a92.mp3", "p": "/p/duolingo-500-hours/"}, {"en": "We come to put down roots.", "ko": "뿌리를 내리러 왔습니다", "a": "/audio/9ea1a984240b.mp3", "p": "/p/chung-euisun-put-down-roots/"}, {"en": "First and foremost, thank you all for coming.", "ko": "무엇보다 먼저, 와 주셔서 감사해요", "a": "/audio/333277673dd7.mp3", "p": "/p/chung-euisun-put-down-roots/"}, {"en": "I'm on the fence.", "ko": "아직 고민 중이야", "a": "/audio/fc94bd5bcde1.mp3", "p": "/p/on-the-fence/"}, {"en": "I'm on a tight deadline.", "ko": "마감이 빠듯해요", "a": "/audio/bd020351f04f.mp3", "p": "/p/deadline-origin/"}, {"en": "Do you speak English?", "ko": "영어 하세요?", "a": "/audio/0d84e7f15953.mp3", "p": "/p/do-you-speak-english/"}], "pool": {"talk": [{"en": "Good, how about you?", "ko": "좋아, 너는?", "a": "/audio/a3199443bc97.mp3", "p": "/p/how-are-you/"}, {"en": "Pretty good, you?", "ko": "꽤 괜찮아, 너는?", "a": "/audio/103608212b3c.mp3", "p": "/p/how-are-you/"}, {"en": "Not bad. How's it going with you?", "ko": "나쁘지 않아. 너는 어때?", "a": "/audio/2ece0aaaa361.mp3", "p": "/p/how-are-you/"}, {"en": "Can't complain.", "ko": "나쁘지 않아.", "a": "/audio/68c6d8ead56b.mp3", "p": "/p/how-are-you/"}, {"en": "Hanging in there.", "ko": "그럭저럭 버티는 중이야.", "a": "/audio/4fa9482ee946.mp3", "p": "/p/how-are-you/"}, {"en": "Not much. You?", "ko": "별일 없어. 너는?", "a": "/audio/783c4545ecda.mp3", "p": "/p/how-are-you/"}, {"en": "Just chilling.", "ko": "그냥 쉬고 있어.", "a": "/audio/e83ec749ac20.mp3", "p": "/p/how-are-you/"}, {"en": "Tell me about it. Hang in there!", "ko": "내 말이. 힘내!", "a": "/audio/222813ebc08f.mp3", "p": "/p/how-are-you/"}, {"en": "How have you been?", "ko": "그동안 잘 지냈어?", "a": "/audio/f67e8f5be362.mp3", "p": "/p/how-are-you/"}, {"en": "How's your day going?", "ko": "오늘 하루 어때요?", "a": "/audio/a0c64a342ed1.mp3", "p": "/p/how-are-you/"}, {"en": "How was your weekend?", "ko": "주말 어땠어?", "a": "/audio/ddb0b90fcb14.mp3", "p": "/p/how-are-you/"}, {"en": "Good! Just got back from a short trip.", "ko": "좋았어! 짧게 여행 다녀왔어.", "a": "/audio/67b1feb44240.mp3", "p": "/p/how-are-you/"}, {"en": "How's it going?", "ko": "잘 지내?", "a": "/audio/7f64e5716842.mp3", "p": "/p/how-are-you/"}, {"en": "How are you doing?", "ko": "어떻게 지내요?", "a": "/audio/254fc38dc274.mp3", "p": "/p/how-are-you/"}, {"en": "How's everything?", "ko": "다 괜찮아요? 별일 없죠?", "a": "/audio/5fabda612a15.mp3", "p": "/p/how-are-you/"}, {"en": "Excuse me, can I get past?", "ko": "실례합니다, 좀 지나갈게요.", "a": "/audio/5ef882c086f2.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, is this seat taken?", "ko": "저기요, 여기 자리 있어요?", "a": "/audio/aa8b0a928d7b.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Oh, sorry! Are you okay?", "ko": "앗, 죄송해요! 괜찮으세요?", "a": "/audio/09f37eb74341.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Sorry, my mistake.", "ko": "죄송해요, 제 실수예요.", "a": "/audio/a63053301c1c.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Sorry? I didn't catch that.", "ko": "네? 잘 못 들었어요.", "a": "/audio/70a2bf568862.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Could you say that again?", "ko": "다시 한번 말씀해 주시겠어요?", "a": "/audio/cf2a2748ec8e.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, is this the line for the bus?", "ko": "실례지만, 여기가 버스 줄인가요?", "a": "/audio/084fa9cdc884.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Is this the line for the bus?", "ko": "여기 버스 타는 줄이에요?", "a": "/audio/d8fd4df13ec8.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, coming through.", "ko": "실례합니다, 좀 지나갈게요.", "a": "/audio/7314495260f4.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, do you work here?", "ko": "저기요, 여기 직원이세요?", "a": "/audio/465783e27e99.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me for a second.", "ko": "잠깐 실례할게요.", "a": "/audio/ea45b7da3a2b.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Sorry, could you say that again?", "ko": "죄송한데 다시 한번 말씀해 주시겠어요?", "a": "/audio/80a24d81be29.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you speak a little more slowly?", "ko": "조금만 더 천천히 말씀해 주시겠어요?", "a": "/audio/a8a27020a5de.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you spell that for me?", "ko": "철자를 불러 주시겠어요?", "a": "/audio/dc79ae153136.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you write it down for me?", "ko": "적어 주실 수 있을까요?", "a": "/audio/ebfa6e7f1e1c.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Just to make sure, you mean Tuesday?", "ko": "확인차 여쭤볼게요, 화요일 말씀하신 거죠?", "a": "/audio/1533df62dbc0.mp3", "p": "/p/ask-to-repeat/"}, {"en": "So you're saying I need to come back tomorrow?", "ko": "그러니까 내일 다시 와야 한다는 말씀이시죠?", "a": "/audio/c7a4e53071c4.mp3", "p": "/p/ask-to-repeat/"}, {"en": "English isn't my first language, so please bear with me.", "ko": "영어가 모국어가 아니라서 조금만 양해해 주세요.", "a": "/audio/24dbe40d0ffd.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, what time did you say?", "ko": "죄송한데, 몇 시라고 하셨죠?", "a": "/audio/102b9a0dc7da.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, I missed the last part.", "ko": "죄송해요, 마지막 부분을 놓쳤어요.", "a": "/audio/c1cc8265b944.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Which gate was that again?", "ko": "몇 번 게이트라고 하셨죠?", "a": "/audio/3099f4a5c6a8.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Did you say fifteen or fifty?", "ko": "15라고 하셨어요, 50이라고 하셨어요?", "a": "/audio/8181e2187ba7.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Is that one-five or five-zero?", "ko": "1, 5예요, 아니면 5, 0이에요?", "a": "/audio/12c235825766.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, I didn't catch that.", "ko": "죄송해요, 잘 못 들었어요.", "a": "/audio/1e03778a85b2.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Let's meet at six. Sounds good!", "ko": "6시에 만나자. 좋아!", "a": "/audio/37e820e889b3.mp3", "p": "/p/sounds-good/"}, {"en": "How about Friday? That works for me.", "ko": "금요일 어때? 난 괜찮아.", "a": "/audio/01d597c46b71.mp3", "p": "/p/sounds-good/"}, {"en": "We'll grab dinner after the movie. Sounds like a plan.", "ko": "영화 보고 저녁 먹자. 좋은 계획이네, 그러자.", "a": "/audio/df6f8ac321e1.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds great!", "ko": "너무 좋아!", "a": "/audio/f84b39c21589.mp3", "p": "/p/sounds-good/"}, {"en": "Works for me.", "ko": "난 좋아.", "a": "/audio/95386e5da8c3.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds good. I'll update the invite.", "ko": "좋아요. 일정 초대를 바꿀게요.", "a": "/audio/7d32284fbcaa.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds good. See you at three.", "ko": "좋아요. 3시에 봐요.", "a": "/audio/371685c21481.mp3", "p": "/p/sounds-good/"}, {"en": "A picnic by the river? Sounds fun!", "ko": "강가에서 소풍? 재밌겠다!", "a": "/audio/cfd17c5fbc35.mp3", "p": "/p/sounds-good/"}, {"en": "You worked all weekend? That sounds tough.", "ko": "주말 내내 일했어? 힘들었겠다.", "a": "/audio/db9a05d95fe3.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds like a lot of work.", "ko": "일이 많겠네.", "a": "/audio/22ab80cd7110.mp3", "p": "/p/sounds-good/"}, {"en": "That sounds amazing. I'm so happy for you.", "ko": "진짜 멋지다. 정말 잘됐다.", "a": "/audio/efadc152cf58.mp3", "p": "/p/sounds-good/"}, {"en": "Pizza and a movie tonight? Sounds perfect.", "ko": "오늘 밤 피자랑 영화? 완벽해.", "a": "/audio/93d445f33127.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds good to me. Let's do it.", "ko": "난 좋아. 그렇게 하자.", "a": "/audio/03b81946d964.mp3", "p": "/p/sounds-good/"}, {"en": "Pizza tonight? I'm down!", "ko": "오늘 밤 피자? 콜!", "a": "/audio/788efdb01219.mp3", "p": "/p/im-down/"}, {"en": "I'm down for a movie this weekend.", "ko": "이번 주말에 영화 좋아.", "a": "/audio/48fe5d8bff64.mp3", "p": "/p/im-down/"}, {"en": "Are you down to go hiking tomorrow?", "ko": "내일 등산 갈래?", "a": "/audio/395db0aa2c45.mp3", "p": "/p/im-down/"}, {"en": "I'm feeling down today.", "ko": "오늘 좀 우울해.", "a": "/audio/a41559015dbc.mp3", "p": "/p/im-down/"}, {"en": "He's been a little down lately.", "ko": "걔 요즘 좀 기운이 없어.", "a": "/audio/e5a254484d62.mp3", "p": "/p/im-down/"}, {"en": "Count me in.", "ko": "나도 끼워줘.", "a": "/audio/2dab559c1180.mp3", "p": "/p/im-down/"}, {"en": "Oh, I'm down! What time?", "ko": "오, 콜! 몇 시에?", "a": "/audio/eb670e6ba461.mp3", "p": "/p/im-down/"}, {"en": "Totally. I'll text her.", "ko": "당연하지. 내가 문자할게.", "a": "/audio/b4f192929fa9.mp3", "p": "/p/im-down/"}, {"en": "She's really down-to-earth.", "ko": "그 사람 정말 소탈해.", "a": "/audio/fc7a37703a79.mp3", "p": "/p/im-down/"}, {"en": "I don't want to let you down.", "ko": "너를 실망시키고 싶지 않아.", "a": "/audio/ee12c8070c5d.mp3", "p": "/p/im-down/"}, {"en": "Do you want some more? I'm good, thanks.", "ko": "더 줄까? 아니 괜찮아, 고마워.", "a": "/audio/f704c9b067dc.mp3", "p": "/p/im-good/"}, {"en": "Do you need a bag? I'm good.", "ko": "봉투 필요하세요? 괜찮아요.", "a": "/audio/64ab982251d4.mp3", "p": "/p/im-good/"}, {"en": "Can I get you anything to drink? I'm good for now.", "ko": "마실 거 갖다 드릴까요? 지금은 괜찮아요.", "a": "/audio/0e5e631ed328.mp3", "p": "/p/im-good/"}, {"en": "No, thanks.", "ko": "괜찮아요, 고마워요.", "a": "/audio/801ea2200946.mp3", "p": "/p/im-good/"}, {"en": "I'm all set.", "ko": "다 됐어요.", "a": "/audio/b4cdf073f19b.mp3", "p": "/p/im-good/"}, {"en": "I'm good, thanks. Could we get the check?", "ko": "괜찮아요, 고마워요. 계산서 주시겠어요?", "a": "/audio/8451cc1a091e.mp3", "p": "/p/im-good/"}, {"en": "Oh, yes, please. That would be great.", "ko": "아, 네, 부탁해요. 그럼 좋겠어요.", "a": "/audio/a6e4daca5ab3.mp3", "p": "/p/im-good/"}, {"en": "I'm good on coffee, thanks. Just water, please.", "ko": "커피는 괜찮아요. 물만 주세요.", "a": "/audio/c4fb397ec2ae.mp3", "p": "/p/im-good/"}, {"en": "I'm good, but thanks for asking.", "ko": "괜찮아요, 그래도 물어봐 줘서 고마워요.", "a": "/audio/80222c2d7c89.mp3", "p": "/p/im-good/"}, {"en": "Are we good? Yeah, we're good.", "ko": "우리 괜찮은 거지? 응, 아무 문제 없어.", "a": "/audio/f28cbca34c46.mp3", "p": "/p/im-good/"}, {"en": "I'm craving pizza right now.", "ko": "지금 피자 너무 당겨.", "a": "/audio/9080fdcb9753.mp3", "p": "/p/craving/"}, {"en": "I've been craving tteokbokki all day.", "ko": "하루 종일 떡볶이가 당겼어.", "a": "/audio/f9824679e63f.mp3", "p": "/p/craving/"}, {"en": "I have a craving for something sweet.", "ko": "단 게 당겨.", "a": "/audio/d8c616cbdd2f.mp3", "p": "/p/craving/"}, {"en": "I could go for some coffee.", "ko": "커피 한잔하면 딱 좋겠다.", "a": "/audio/0ee64c423509.mp3", "p": "/p/craving/"}, {"en": "I'm in the mood for Mexican food.", "ko": "오늘은 멕시코 음식이 먹고 싶은 기분이야.", "a": "/audio/a593111dd3a8.mp3", "p": "/p/craving/"}, {"en": "Honestly, I'm craving something spicy.", "ko": "솔직히 매운 게 당겨.", "a": "/audio/4e7008c16cfa.mp3", "p": "/p/craving/"}, {"en": "Perfect. I've been craving it all week.", "ko": "딱 좋아. 일주일 내내 당겼거든.", "a": "/audio/6fbd9f738ab0.mp3", "p": "/p/craving/"}, {"en": "What are you craving?", "ko": "뭐가 당겨?", "a": "/audio/d5cbffd95887.mp3", "p": "/p/craving/"}, {"en": "I'm not really craving anything.", "ko": "딱히 당기는 건 없어.", "a": "/audio/569bd60bfe09.mp3", "p": "/p/craving/"}, {"en": "Late-night cravings are the worst.", "ko": "야식 당기는 게 제일 괴로워.", "a": "/audio/dfb5c542037b.mp3", "p": "/p/craving/"}, {"en": "It's so cold. I'm craving some hot soup.", "ko": "너무 춥다. 뜨끈한 국물이 당겨.", "a": "/audio/f79f11d1ade0.mp3", "p": "/p/craving/"}, {"en": "I always crave sweets when I'm stressed.", "ko": "스트레스 받으면 꼭 단 게 당겨.", "a": "/audio/acef01b5c6d9.mp3", "p": "/p/craving/"}, {"en": "After a long day, I'm craving fried chicken.", "ko": "힘든 하루 끝나니까 치킨이 당겨.", "a": "/audio/557c94253800.mp3", "p": "/p/craving/"}, {"en": "Put your wallet away. It's on me.", "ko": "지갑 넣어. 내가 낼게.", "a": "/audio/9bd7a3eb1a74.mp3", "p": "/p/its-on-me/"}, {"en": "Thanks for helping me move. Dinner's on me.", "ko": "이사 도와줘서 고마워. 저녁은 내가 살게.", "a": "/audio/ba655fbe94a0.mp3", "p": "/p/its-on-me/"}, {"en": "Next round is on you!", "ko": "다음 건 네가 사!", "a": "/audio/bde338e8f456.mp3", "p": "/p/its-on-me/"}, {"en": "Let's split the bill.", "ko": "나눠서 내자.", "a": "/audio/73ac1f3a9534.mp3", "p": "/p/its-on-me/"}, {"en": "Can we pay separately?", "ko": "따로 계산할 수 있을까요?", "a": "/audio/73cb4d877563.mp3", "p": "/p/its-on-me/"}, {"en": "It's fine. You can get the next one.", "ko": "괜찮아. 다음엔 네가 사.", "a": "/audio/ca3e83ed01b8.mp3", "p": "/p/its-on-me/"}, {"en": "Are you sure? Thank you so much.", "ko": "진짜? 정말 고마워.", "a": "/audio/4df706e7e319.mp3", "p": "/p/its-on-me/"}, {"en": "Then next time it's on me.", "ko": "그럼 다음엔 내가 살게.", "a": "/audio/8cfe0f9fa2d7.mp3", "p": "/p/its-on-me/"}, {"en": "At least let me get the coffee.", "ko": "그럼 커피는 내가 살게.", "a": "/audio/58afd291e250.mp3", "p": "/p/its-on-me/"}, {"en": "I forgot to book the table. That's on me.", "ko": "자리 예약하는 걸 깜빡했어. 내 탓이야.", "a": "/audio/9914a579b745.mp3", "p": "/p/its-on-me/"}, {"en": "The delay is on us. We'll fix it today.", "ko": "지연은 저희 책임이에요. 오늘 해결할게요.", "a": "/audio/6df445b5748b.mp3", "p": "/p/its-on-me/"}, {"en": "You got lunch, so I'll get the next one.", "ko": "점심은 네가 샀으니까 다음엔 내가 살게.", "a": "/audio/79dff0c5b0cc.mp3", "p": "/p/its-on-me/"}, {"en": "Oops, my bad! Wrong chat.", "ko": "앗, 미안! 방을 잘못 보냈네.", "a": "/audio/aa4880d21d9f.mp3", "p": "/p/my-bad/"}, {"en": "My bad, I thought this seat was empty.", "ko": "미안해요, 빈자리인 줄 알았어요.", "a": "/audio/4bb7041c4330.mp3", "p": "/p/my-bad/"}, {"en": "That was my bad. I'll fix it.", "ko": "그건 내 실수야. 내가 고칠게.", "a": "/audio/5890357a79c6.mp3", "p": "/p/my-bad/"}, {"en": "I apologize for the mistake.", "ko": "실수해서 죄송합니다.", "a": "/audio/9b9e36443fb3.mp3", "p": "/p/my-bad/"}, {"en": "That was my mistake. It won't happen again.", "ko": "제 실수였어요. 다시는 그런 일 없을 거예요.", "a": "/audio/375c9cb35985.mp3", "p": "/p/my-bad/"}, {"en": "No worries.", "ko": "괜찮아, 신경 쓰지 마.", "a": "/audio/2c04180db4ef.mp3", "p": "/p/my-bad/"}, {"en": "All good.", "ko": "다 괜찮아.", "a": "/audio/6b2ae94fdaa1.mp3", "p": "/p/my-bad/"}, {"en": "Oh, my bad! Here's the right one.", "ko": "앗, 미안! 여기 맞는 주소야.", "a": "/audio/20ff099c1bbd.mp3", "p": "/p/my-bad/"}, {"en": "See you!", "ko": "이따 봐!", "a": "/audio/dc5e03f9e5f1.mp3", "p": "/p/my-bad/"}, {"en": "Sorry, my bad. I read the time wrong.", "ko": "미안, 내 실수야. 시간을 잘못 봤어.", "a": "/audio/c3d617327873.mp3", "p": "/p/my-bad/"}, {"en": "My bad for being late.", "ko": "늦어서 미안.", "a": "/audio/3455d1ba404d.mp3", "p": "/p/my-bad/"}, {"en": "My mistake. Let me check again.", "ko": "제 실수네요. 다시 확인해 볼게요.", "a": "/audio/9b6b037a1863.mp3", "p": "/p/my-bad/"}, {"en": "Sorry, that's on me.", "ko": "미안, 그건 내 탓이야.", "a": "/audio/5f2752edb047.mp3", "p": "/p/my-bad/"}, {"en": "Oops, bad pass. My bad!", "ko": "앗, 패스 잘못했다. 미안!", "a": "/audio/f843868ada87.mp3", "p": "/p/my-bad/"}, {"en": "I'm looking forward to seeing you.", "ko": "만나길 기대하고 있어요.", "a": "/audio/bd61c6bd27a3.mp3", "p": "/p/looking-forward-to/"}, {"en": "I'm looking forward to the weekend.", "ko": "주말만 기다리고 있어.", "a": "/audio/5193709b684a.mp3", "p": "/p/looking-forward-to/"}, {"en": "We look forward to hearing from you.", "ko": "답장 기다리겠습니다.", "a": "/audio/8aab601a7a6a.mp3", "p": "/p/looking-forward-to/"}, {"en": "I look forward to working with you.", "ko": "함께 일하게 되어 기대됩니다.", "a": "/audio/b97c1bc1d5df.mp3", "p": "/p/looking-forward-to/"}, {"en": "We're really looking forward to our trip to Jeju.", "ko": "우리 제주도 여행 정말 기대하고 있어.", "a": "/audio/27e026245b8c.mp3", "p": "/p/looking-forward-to/"}, {"en": "I'm not looking forward to Monday's meeting.", "ko": "월요일 회의는 별로 기대 안 돼.", "a": "/audio/90e20ef283e8.mp3", "p": "/p/looking-forward-to/"}, {"en": "I was looking forward to the concert, but it got canceled.", "ko": "콘서트 기대하고 있었는데 취소됐어.", "a": "/audio/af0b45eb7b43.mp3", "p": "/p/looking-forward-to/"}, {"en": "Yes! I'm really looking forward to it.", "ko": "응! 진짜 기대돼.", "a": "/audio/46b225e6f339.mp3", "p": "/p/looking-forward-to/"}, {"en": "I look forward to meeting your team.", "ko": "팀분들 만나 뵙길 기대합니다.", "a": "/audio/91e74dd870c2.mp3", "p": "/p/looking-forward-to/"}, {"en": "I'm looking forward to the party.", "ko": "파티 기대돼.", "a": "/audio/3b302e9d9842.mp3", "p": "/p/looking-forward-to/"}, {"en": "I'm sorry to hear that.", "ko": "그런 일이 있었다니 마음이 안 좋네요.", "a": "/audio/bf143c59d796.mp3", "p": "/p/sorry-to-hear/"}, {"en": "That sounds really tough.", "ko": "정말 힘들었겠다.", "a": "/audio/b4318a8188e1.mp3", "p": "/p/sorry-to-hear/"}, {"en": "That must be frustrating.", "ko": "진짜 답답하겠다.", "a": "/audio/f3c69c276598.mp3", "p": "/p/sorry-to-hear/"}, {"en": "I'm here if you need anything.", "ko": "필요한 거 있으면 말해. 내가 있잖아.", "a": "/audio/05ab1d32a2a8.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Do you want to talk about it?", "ko": "얘기하고 싶으면 들어 줄게.", "a": "/audio/50f7519fac55.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Hang in there.", "ko": "조금만 버텨, 힘내.", "a": "/audio/9090a15192be.mp3", "p": "/p/sorry-to-hear/"}, {"en": "You've got this.", "ko": "넌 해낼 거야.", "a": "/audio/6a6b6d374339.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Oh no, I'm sorry. That's really disappointing.", "ko": "아, 어떡해. 정말 속상하겠다.", "a": "/audio/9a6eb871243d.mp3", "p": "/p/sorry-to-hear/"}, {"en": "I know you did. Want to grab dinner tonight? My treat.", "ko": "알지. 오늘 저녁 같이 먹을래? 내가 살게.", "a": "/audio/3d3fa9566f5a.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Just heard the news. Thinking of you.", "ko": "소식 들었어. 네 생각 하고 있어.", "a": "/audio/09724cd102c8.mp3", "p": "/p/sorry-to-hear/"}, {"en": "No need to reply. Just wanted you to know I'm here.", "ko": "답장 안 해도 돼. 내가 곁에 있다는 것만 알아줘.", "a": "/audio/a140a8468035.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Let me know if there's anything I can do.", "ko": "내가 할 수 있는 게 있으면 말해 줘.", "a": "/audio/0a4b8eb7f783.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Take all the time you need.", "ko": "천천히 해도 괜찮아.", "a": "/audio/1ce416c59cac.mp3", "p": "/p/sorry-to-hear/"}, {"en": "Don't you like coffee? Yes, I do.", "ko": "커피 안 좋아해? → 아니, 좋아해.", "a": "/audio/0431b5034001.mp3", "p": "/p/negative-question/"}, {"en": "Don't you like coffee? No, I don't.", "ko": "커피 안 좋아해? → 응, 안 좋아해.", "a": "/audio/4ddcdea064de.mp3", "p": "/p/negative-question/"}, {"en": "Aren't you hungry? Yes, I'm starving.", "ko": "배 안 고파? → 아니, 엄청 고파.", "a": "/audio/bebfcd8f4ece.mp3", "p": "/p/negative-question/"}, {"en": "Didn't you go? No, I didn't.", "ko": "안 갔어? → 응, 안 갔어.", "a": "/audio/d21decdece78.mp3", "p": "/p/negative-question/"}, {"en": "I do! I love coffee.", "ko": "좋아해! 커피 엄청 좋아해.", "a": "/audio/09426a8a32a8.mp3", "p": "/p/negative-question/"}, {"en": "I'm not, actually.", "ko": "사실 안 고파.", "a": "/audio/eba0952ff68e.mp3", "p": "/p/negative-question/"}, {"en": "You're not hungry, are you? No, I'm not.", "ko": "너 배 안 고프지? → 응, 안 고파.", "a": "/audio/0eb2ff1366e3.mp3", "p": "/p/negative-question/"}, {"en": "You're not hungry, are you? Yes, I am, actually.", "ko": "너 배 안 고프지? → 아니, 사실 고파.", "a": "/audio/1642abeab1b6.mp3", "p": "/p/negative-question/"}, {"en": "No, I can't. I have to work late.", "ko": "응, 못 가. 늦게까지 일해야 해.", "a": "/audio/e0dd2c3dd876.mp3", "p": "/p/negative-question/"}, {"en": "Yes, I did, but my plans changed.", "ko": "그래, 그렇게 말했지. 근데 계획이 바뀌었어.", "a": "/audio/edd1ff1e7c3c.mp3", "p": "/p/negative-question/"}, {"en": "Don't you have a car?", "ko": "차가 있다면?", "a": "/audio/cc87d76e1994.mp3", "p": "/p/negative-question/"}, {"en": "Isn't it cold today?", "ko": "춥지 않다면?", "a": "/audio/57222ddc0bd8.mp3", "p": "/p/negative-question/"}, {"en": "Don't you know?", "ko": "몰라?", "a": "/audio/893d26e76d8f.mp3", "p": "/p/negative-question/"}, {"en": "Didn't you call him?", "ko": "걔한테 전화 안 했어?", "a": "/audio/429947122cc3.mp3", "p": "/p/negative-question/"}, {"en": "Can you open the window?", "ko": "창문 좀 열어 줄래?", "a": "/audio/3ef6e0c9295a.mp3", "p": "/p/would-you-mind/"}, {"en": "Could you open the window?", "ko": "창문 좀 열어 주시겠어요?", "a": "/audio/7bf6fbc52ed1.mp3", "p": "/p/would-you-mind/"}, {"en": "Would you mind opening the window?", "ko": "창문 좀 열어 주실 수 있을까요?", "a": "/audio/ff027fad18bf.mp3", "p": "/p/would-you-mind/"}, {"en": "Would you mind closing the door? Not at all.", "ko": "문 좀 닫아 주실래요? 그럼요.", "a": "/audio/95baf39ddabe.mp3", "p": "/p/would-you-mind/"}, {"en": "Do you mind if I sit here? No, go ahead.", "ko": "여기 앉아도 될까요? 그럼요, 앉으세요.", "a": "/audio/c1e313612f41.mp3", "p": "/p/would-you-mind/"}, {"en": "Excuse me, would you mind switching seats with me?", "ko": "실례지만 저랑 자리 좀 바꿔 주실 수 있을까요?", "a": "/audio/c7c28cb3f79e.mp3", "p": "/p/would-you-mind/"}, {"en": "Yes, we got separated. Thank you so much.", "ko": "네, 자리가 떨어져서요. 정말 감사해요.", "a": "/audio/bf6e9c6f8d34.mp3", "p": "/p/would-you-mind/"}, {"en": "Sorry, I'd rather keep it closed. I'm a bit cold.", "ko": "죄송한데 닫아 두고 싶어요. 좀 추워서요.", "a": "/audio/89f2fca3487c.mp3", "p": "/p/would-you-mind/"}, {"en": "Actually, I'd prefer if you didn't. Sorry about that.", "ko": "사실 안 하셨으면 좋겠어요. 죄송해요.", "a": "/audio/af7a44273bbc.mp3", "p": "/p/would-you-mind/"}, {"en": "I was wondering if you could help me with this.", "ko": "혹시 이것 좀 도와주실 수 있을까 해서요.", "a": "/audio/f35a3b065266.mp3", "p": "/p/would-you-mind/"}, {"en": "Would it be possible to change my seat?", "ko": "자리를 바꿀 수 있을까요?", "a": "/audio/8337ff790f7c.mp3", "p": "/p/would-you-mind/"}, {"en": "What do you call this in English?", "ko": "이거 영어로 뭐라고 해요?", "a": "/audio/fbec9c56330e.mp3", "p": "/p/what-do-you-call/"}, {"en": "We call it a stapler.", "ko": "그건 스테이플러라고 해요.", "a": "/audio/9558979f2b0e.mp3", "p": "/p/what-do-you-call/"}, {"en": "How do you say this in English?", "ko": "이 말을 영어로 어떻게 해요?", "a": "/audio/dc75b7becbeb.mp3", "p": "/p/what-do-you-call/"}, {"en": "What does \"awkward\" mean?", "ko": "'awkward'가 무슨 뜻이에요?", "a": "/audio/ef71453e6221.mp3", "p": "/p/what-do-you-call/"}, {"en": "How do you spell that?", "ko": "철자가 어떻게 돼요?", "a": "/audio/325e6b0ed31b.mp3", "p": "/p/what-do-you-call/"}, {"en": "What's the word for a person who doesn't eat meat?", "ko": "고기 안 먹는 사람을 뭐라고 하더라?", "a": "/audio/762647b3b168.mp3", "p": "/p/what-do-you-call/"}, {"en": "It's a thing you use to open cans.", "ko": "캔 딸 때 쓰는 그거 있잖아요.", "a": "/audio/26f0a3443504.mp3", "p": "/p/what-do-you-call/"}, {"en": "It's like a small knife, but it folds.", "ko": "작은 칼 같은 건데 접히는 거요.", "a": "/audio/c7eaad8d2cfc.mp3", "p": "/p/what-do-you-call/"}, {"en": "What's the word for it? It's on the tip of my tongue.", "ko": "그걸 뭐라고 하더라? 입에서 맴도는데.", "a": "/audio/19b33fdd5144.mp3", "p": "/p/what-do-you-call/"}, {"en": "Sorry, what do you call this in English?", "ko": "죄송한데, 이거 영어로 뭐라고 해요?", "a": "/audio/352436090f42.mp3", "p": "/p/what-do-you-call/"}, {"en": "A ladle? How do you spell that?", "ko": "레이들이요? 철자가 어떻게 돼요?", "a": "/audio/6a3d4b3ac81b.mp3", "p": "/p/what-do-you-call/"}, {"en": "I'll be there in ten minutes.", "ko": "10분 뒤에 도착해.", "a": "/audio/e6f2f2ec2076.mp3", "p": "/p/in-vs-after/"}, {"en": "The movie starts in an hour.", "ko": "영화 한 시간 뒤에 시작해.", "a": "/audio/8f4359dcfd17.mp3", "p": "/p/in-vs-after/"}, {"en": "I'll call you back in five.", "ko": "5분 뒤에 다시 전화할게.", "a": "/audio/111a4d15e319.mp3", "p": "/p/in-vs-after/"}, {"en": "Let's take a walk after lunch.", "ko": "점심 먹고 산책하자.", "a": "/audio/6d62a3a6f5e8.mp3", "p": "/p/in-vs-after/"}, {"en": "He left after ten minutes.", "ko": "그는 10분 있다가 떠났어.", "a": "/audio/da8bd87d84a4.mp3", "p": "/p/in-vs-after/"}, {"en": "Please reply within 24 hours.", "ko": "24시간 이내에 답장 주세요.", "a": "/audio/63d205087395.mp3", "p": "/p/in-vs-after/"}, {"en": "The bus leaves in five minutes.", "ko": "버스가 (지금부터) 5분 뒤에 출발해요.", "a": "/audio/ee2c72706b22.mp3", "p": "/p/in-vs-after/"}, {"en": "The bus left five minutes after we arrived.", "ko": "버스는 우리가 도착하고 5분 뒤에 떠났어요.", "a": "/audio/e5595245c759.mp3", "p": "/p/in-vs-after/"}, {"en": "I finished the report in two hours.", "ko": "보고서를 두 시간 만에 끝냈어요.", "a": "/audio/7962abd510f1.mp3", "p": "/p/in-vs-after/"}, {"en": "I started the report after two hours.", "ko": "두 시간이 지나서야 보고서를 시작했어요.", "a": "/audio/15769169e1d9.mp3", "p": "/p/in-vs-after/"}, {"en": "Sorry! I'll be there in ten minutes.", "ko": "미안! 10분 뒤에 도착해.", "a": "/audio/3a8351f6e2d7.mp3", "p": "/p/in-vs-after/"}, {"en": "Thanks! I'll pay you back after the movie.", "ko": "고마워! 영화 끝나고 돈 줄게.", "a": "/audio/d21b5154252a.mp3", "p": "/p/in-vs-after/"}, {"en": "cell phone", "ko": "핸드폰", "a": "/audio/f8ca8737a890.mp3", "p": "/p/konglish/"}, {"en": "You got this!", "ko": "화이팅!", "a": "/audio/0bff840d0012.mp3", "p": "/p/konglish/"}, {"en": "window shopping", "ko": "아이쇼핑", "a": "/audio/6fc383623236.mp3", "p": "/p/konglish/"}, {"en": "part-time job", "ko": "아르바이트", "a": "/audio/9bf76ff1a501.mp3", "p": "/p/konglish/"}, {"en": "studio apartment", "ko": "원룸", "a": "/audio/b013496ba449.mp3", "p": "/p/konglish/"}, {"en": "Good luck!", "ko": "행운을 빌어!", "a": "/audio/7c9cf2016455.mp3", "p": "/p/konglish/"}, {"en": "Go for it!", "ko": "해 봐! 질러!", "a": "/audio/64d23aee5987.mp3", "p": "/p/konglish/"}, {"en": "Let's go!", "ko": "가자!", "a": "/audio/5ff628f4e32a.mp3", "p": "/p/konglish/"}, {"en": "Can I get your autograph?", "ko": "사인 좀 받을 수 있을까요?", "a": "/audio/a5aaf0ac5be3.mp3", "p": "/p/konglish/"}, {"en": "Let me take a selfie.", "ko": "셀카 찍을게.", "a": "/audio/20194ae88382.mp3", "p": "/p/konglish/"}, {"en": "Could you turn on the AC?", "ko": "에어컨 좀 켜 줄래?", "a": "/audio/619eac1924b5.mp3", "p": "/p/konglish/"}, {"en": "This one is on the house.", "ko": "이건 서비스예요.", "a": "/audio/b2981067ce35.mp3", "p": "/p/konglish/"}, {"en": "Keep both hands on the steering wheel.", "ko": "핸들은 두 손으로 잡아.", "a": "/audio/3513c310e5ca.mp3", "p": "/p/konglish/"}, {"en": "My friend set me up on a blind date.", "ko": "친구가 소개팅을 시켜 줬어.", "a": "/audio/dd839155fd39.mp3", "p": "/p/konglish/"}, {"en": "You got this! You've prepared so much.", "ko": "넌 할 수 있어! 준비 많이 했잖아.", "a": "/audio/af993af046f8.mp3", "p": "/p/konglish/"}, {"en": "Good luck! Let me know how it goes.", "ko": "행운을 빌어! 어떻게 됐는지 알려 줘.", "a": "/audio/f15a04aa1eb1.mp3", "p": "/p/konglish/"}, {"en": "So we meet at seven and go together. Does that make sense?", "ko": "그러니까 7시에 만나서 같이 가는 거야. 이해돼?", "a": "/audio/d4df42859510.mp3", "p": "/p/make-sense/"}, {"en": "That makes sense.", "ko": "아, 그렇구나. 이해돼.", "a": "/audio/25140380028c.mp3", "p": "/p/make-sense/"}, {"en": "It doesn't make sense.", "ko": "그건 말이 안 돼.", "a": "/audio/74fdd2496893.mp3", "p": "/p/make-sense/"}, {"en": "Yeah, makes sense.", "ko": "응, 이해했어.", "a": "/audio/cba2b8390fb7.mp3", "p": "/p/make-sense/"}, {"en": "Not really. Could you explain that again?", "ko": "잘 모르겠어. 다시 설명해 줄래?", "a": "/audio/98697388f098.mp3", "p": "/p/make-sense/"}, {"en": "Mostly. Do I need to sign it too?", "ko": "대부분요. 서명도 해야 하나요?", "a": "/audio/e1aca9f66afd.mp3", "p": "/p/make-sense/"}, {"en": "Got it. That makes sense now.", "ko": "알겠어요. 이제 이해돼요.", "a": "/audio/f4b8f5cc6217.mp3", "p": "/p/make-sense/"}, {"en": "It makes sense to leave early.", "ko": "일찍 출발하는 게 합리적이야.", "a": "/audio/2b7af188a375.mp3", "p": "/p/make-sense/"}, {"en": "Now it all makes sense.", "ko": "이제야 다 이해가 되네.", "a": "/audio/18841cc4562a.mp3", "p": "/p/make-sense/"}, {"en": "I can't make sense of this chart.", "ko": "이 표가 무슨 말인지 모르겠어.", "a": "/audio/80667aad2599.mp3", "p": "/p/make-sense/"}], "travel": [{"en": "Chicken, please.", "ko": "닭고기로 주세요.", "a": "/audio/74c163511946.mp3", "p": "/p/in-flight/"}, {"en": "Can I get some water, please?", "ko": "물 좀 주시겠어요?", "a": "/audio/09a20332f783.mp3", "p": "/p/in-flight/"}, {"en": "Oh, sorry. Sure.", "ko": "아, 죄송해요. 네.", "a": "/audio/abe4564de754.mp3", "p": "/p/in-flight/"}, {"en": "Yes, I'm done. Thank you.", "ko": "네, 다 먹었어요. 감사해요.", "a": "/audio/b39fdadcab98.mp3", "p": "/p/in-flight/"}, {"en": "Can I get a blanket, please?", "ko": "담요 좀 주시겠어요?", "a": "/audio/8e860412dd29.mp3", "p": "/p/in-flight/"}, {"en": "Excuse me, could I get by?", "ko": "실례지만, 좀 지나갈게요.", "a": "/audio/35328d42f1d4.mp3", "p": "/p/in-flight/"}, {"en": "Thank you!", "ko": "감사합니다!", "a": "/audio/d44736082607.mp3", "p": "/p/in-flight/"}, {"en": "Sorry, what are the options?", "ko": "죄송한데, 뭐 뭐 있어요?", "a": "/audio/0c37731a8dde.mp3", "p": "/p/in-flight/"}, {"en": "Excuse me, I think this is my seat.", "ko": "실례지만, 여기 제 자리 같아요.", "a": "/audio/50adce310732.mp3", "p": "/p/in-flight/"}, {"en": "Could you help me put my bag up there?", "ko": "가방 올리는 것 좀 도와주시겠어요?", "a": "/audio/28d6e93c1f86.mp3", "p": "/p/in-flight/"}, {"en": "Do you mind if I recline my seat?", "ko": "등받이 좀 젖혀도 될까요?", "a": "/audio/c9664f8fb757.mp3", "p": "/p/in-flight/"}, {"en": "I'm not feeling well. Could I get some water?", "ko": "속이 좀 안 좋아요. 물 좀 주시겠어요?", "a": "/audio/f263642e0303.mp3", "p": "/p/in-flight/"}, {"en": "Could I get another blanket, please?", "ko": "담요 하나 더 주시겠어요?", "a": "/audio/32054ac0fd99.mp3", "p": "/p/in-flight/"}, {"en": "Please fasten your seatbelt.", "ko": "안전벨트를 매 주세요.", "a": "/audio/4812539e68d7.mp3", "p": "/p/in-flight/"}, {"en": "We're experiencing some turbulence.", "ko": "기체가 조금 흔들리고 있습니다.", "a": "/audio/d06f5bf369bb.mp3", "p": "/p/in-flight/"}, {"en": "I'm here on vacation.", "ko": "여행 왔어요.", "a": "/audio/82dc7864ae1e.mp3", "p": "/p/immigration/"}, {"en": "Pleasure.", "ko": "여행이요.", "a": "/audio/65ab0113d068.mp3", "p": "/p/immigration/"}, {"en": "For a week.", "ko": "일주일이요.", "a": "/audio/e03ef2936f4e.mp3", "p": "/p/immigration/"}, {"en": "At a hotel in downtown Seattle.", "ko": "시애틀 시내 호텔이요.", "a": "/audio/d94ca6fccb02.mp3", "p": "/p/immigration/"}, {"en": "Yes, it's my first time.", "ko": "네, 처음이에요.", "a": "/audio/d95334f1ff2b.mp3", "p": "/p/immigration/"}, {"en": "Here's my return ticket.", "ko": "여기 돌아가는 항공권이요.", "a": "/audio/b1010386860b.mp3", "p": "/p/immigration/"}, {"en": "Sorry, could you repeat the question?", "ko": "죄송한데, 질문 다시 한번 말씀해 주시겠어요?", "a": "/audio/22c4fad64a03.mp3", "p": "/p/immigration/"}, {"en": "Let me check.", "ko": "확인해 볼게요.", "a": "/audio/2a775462c590.mp3", "p": "/p/immigration/"}, {"en": "One moment, please.", "ko": "잠시만요.", "a": "/audio/7db14965da9d.mp3", "p": "/p/immigration/"}, {"en": "Here's my hotel booking.", "ko": "여기 호텔 예약 내역이에요.", "a": "/audio/835124ab18db.mp3", "p": "/p/immigration/"}, {"en": "I'm sorry, I'm a little nervous.", "ko": "죄송해요, 조금 긴장해서요.", "a": "/audio/68264d6f2d5a.mp3", "p": "/p/immigration/"}, {"en": "I'm traveling with my sister.", "ko": "여동생이랑 같이 여행 중이에요.", "a": "/audio/cf560eb422eb.mp3", "p": "/p/immigration/"}, {"en": "I'm flying back on Sunday.", "ko": "일요일에 돌아가는 비행기예요.", "a": "/audio/7ca340149ce3.mp3", "p": "/p/immigration/"}, {"en": "No, nothing to declare.", "ko": "아니요, 신고할 거 없어요.", "a": "/audio/03d57d6b376e.mp3", "p": "/p/baggage-customs/"}, {"en": "Just some snacks.", "ko": "과자 조금이요.", "a": "/audio/de55ca8e2950.mp3", "p": "/p/baggage-customs/"}, {"en": "Sure, go ahead.", "ko": "네, 보세요.", "a": "/audio/10a72721b62f.mp3", "p": "/p/baggage-customs/"}, {"en": "It's a black suitcase with a red tag.", "ko": "빨간 태그가 달린 검은색 캐리어예요.", "a": "/audio/0fd54357f971.mp3", "p": "/p/baggage-customs/"}, {"en": "Where's the baggage claim?", "ko": "짐 찾는 곳이 어디예요?", "a": "/audio/f7a138eb8663.mp3", "p": "/p/baggage-customs/"}, {"en": "My bag didn't come out.", "ko": "제 가방이 안 나왔어요.", "a": "/audio/89963f1a5231.mp3", "p": "/p/baggage-customs/"}, {"en": "Here it is.", "ko": "여기 있어요.", "a": "/audio/8a9e1205bf21.mp3", "p": "/p/baggage-customs/"}, {"en": "Thank you.", "ko": "감사합니다.", "a": "/audio/08cedbdd147e.mp3", "p": "/p/baggage-customs/"}, {"en": "Sorry, could you say that again?", "ko": "죄송한데, 다시 한번 말씀해 주시겠어요?", "a": "/audio/80a24d81be29.mp3", "p": "/p/baggage-customs/"}, {"en": "One of the wheels is broken.", "ko": "바퀴 하나가 부서졌어요.", "a": "/audio/59d7fc992b5a.mp3", "p": "/p/baggage-customs/"}, {"en": "The handle won't come up.", "ko": "손잡이가 안 올라와요.", "a": "/audio/61713fa5c610.mp3", "p": "/p/baggage-customs/"}, {"en": "Someone took my bag by mistake.", "ko": "누가 제 가방을 잘못 가져갔어요.", "a": "/audio/b1e9adf0dd4b.mp3", "p": "/p/baggage-customs/"}, {"en": "Could I get a reference number?", "ko": "접수 번호를 받을 수 있을까요?", "a": "/audio/d2943150b90d.mp3", "p": "/p/baggage-customs/"}, {"en": "How will I know when it arrives?", "ko": "도착하면 어떻게 알 수 있어요?", "a": "/audio/4479783034a6.mp3", "p": "/p/baggage-customs/"}, {"en": "Here's my hotel address.", "ko": "여기 제 호텔 주소예요.", "a": "/audio/5568a0f5eecc.mp3", "p": "/p/baggage-customs/"}, {"en": "To this address, please.", "ko": "이 주소로 가 주세요.", "a": "/audio/bb3e55865f09.mp3", "p": "/p/transportation/"}, {"en": "Yes, please.", "ko": "네, 주세요.", "a": "/audio/eee3c5f86b5f.mp3", "p": "/p/transportation/"}, {"en": "Oh, do you take cards?", "ko": "아, 카드 되나요?", "a": "/audio/aba9a945a1cc.mp3", "p": "/p/transportation/"}, {"en": "Got it. Which line?", "ko": "알겠어요. 몇 호선이요?", "a": "/audio/77d078f5bc2b.mp3", "p": "/p/transportation/"}, {"en": "Can you drop me off here?", "ko": "여기서 내려 주시겠어요?", "a": "/audio/99a38778ff2e.mp3", "p": "/p/transportation/"}, {"en": "Can I pay by card?", "ko": "카드로 계산돼요?", "a": "/audio/e1b2d1ee8a6a.mp3", "p": "/p/transportation/"}, {"en": "Does this bus go downtown?", "ko": "이 버스 시내 가요?", "a": "/audio/f84f9ab7f618.mp3", "p": "/p/transportation/"}, {"en": "Which line goes to the airport?", "ko": "공항 가려면 몇 호선 타요?", "a": "/audio/51618237e0f9.mp3", "p": "/p/transportation/"}, {"en": "Great, thanks.", "ko": "좋아요, 감사해요.", "a": "/audio/556df51dabaf.mp3", "p": "/p/transportation/"}, {"en": "Yes, please. Can I pay by card?", "ko": "네, 주세요. 카드로 계산돼요?", "a": "/audio/2c88cbb57f90.mp3", "p": "/p/transportation/"}, {"en": "Sorry, could you say that more slowly?", "ko": "죄송한데, 조금만 천천히 말씀해 주시겠어요?", "a": "/audio/0d0215187482.mp3", "p": "/p/transportation/"}, {"en": "Which stop should I get off at?", "ko": "어느 정류장에서 내려야 해요?", "a": "/audio/ca30505d82bd.mp3", "p": "/p/transportation/"}, {"en": "Can you tell me when to get off?", "ko": "내릴 때 알려 주실 수 있어요?", "a": "/audio/4c952812abc5.mp3", "p": "/p/transportation/"}, {"en": "Is this seat taken?", "ko": "이 자리 주인 있어요?", "a": "/audio/167d14e8f863.mp3", "p": "/p/transportation/"}, {"en": "I think I'm going the wrong way.", "ko": "반대 방향으로 가고 있는 것 같아요.", "a": "/audio/46202195483c.mp3", "p": "/p/transportation/"}, {"en": "Do I need to go to the other platform?", "ko": "반대편 승강장으로 가야 하나요?", "a": "/audio/203ed0bfa712.mp3", "p": "/p/transportation/"}, {"en": "Is this the right train for the airport?", "ko": "공항 가는 열차 이거 맞아요?", "a": "/audio/17892f1162ed.mp3", "p": "/p/transportation/"}, {"en": "I have a reservation under Kim.", "ko": "김(Kim) 이름으로 예약했어요.", "a": "/audio/57e51910c406.mp3", "p": "/p/hotel-check-in/"}, {"en": "Here's my passport.", "ko": "여기 여권이요.", "a": "/audio/6f1878aca0a7.mp3", "p": "/p/hotel-check-in/"}, {"en": "Two keys, please.", "ko": "키 두 개 주세요.", "a": "/audio/72b41e54e3aa.mp3", "p": "/p/hotel-check-in/"}, {"en": "What time is checkout?", "ko": "체크아웃 몇 시예요?", "a": "/audio/9eccc260f524.mp3", "p": "/p/hotel-check-in/"}, {"en": "Could I get some extra towels?", "ko": "수건 좀 더 주시겠어요?", "a": "/audio/9ad1f181a35b.mp3", "p": "/p/hotel-check-in/"}, {"en": "Can I leave my bags here?", "ko": "짐 좀 맡겨도 될까요?", "a": "/audio/0f671de0749f.mp3", "p": "/p/hotel-check-in/"}, {"en": "Yes. I have a reservation under Kim.", "ko": "네, 김 이름으로 예약했어요.", "a": "/audio/d38e31d816d0.mp3", "p": "/p/hotel-check-in/"}, {"en": "Here you go.", "ko": "여기 있어요.", "a": "/audio/0fe135ba4c6e.mp3", "p": "/p/hotel-check-in/"}, {"en": "The air conditioner isn't working.", "ko": "에어컨이 안 돼요.", "a": "/audio/0b3ca0e43b1b.mp3", "p": "/p/hotel-check-in/"}, {"en": "Would it be possible to check out at noon?", "ko": "12시에 체크아웃해도 될까요?", "a": "/audio/de97fe33d2ff.mp3", "p": "/p/hotel-check-in/"}, {"en": "I'd like to check out. Here's my key.", "ko": "체크아웃할게요. 키 여기 있어요.", "a": "/audio/42c8374a16da.mp3", "p": "/p/hotel-check-in/"}, {"en": "I think there's a charge I don't recognize.", "ko": "모르는 요금이 하나 있는 것 같아요.", "a": "/audio/253470e567ec.mp3", "p": "/p/hotel-check-in/"}, {"en": "Could you call a taxi for me?", "ko": "택시 좀 불러 주시겠어요?", "a": "/audio/c6575be909e5.mp3", "p": "/p/hotel-check-in/"}, {"en": "Could I leave my luggage here until three?", "ko": "3시까지 짐 좀 맡겨 둘 수 있을까요?", "a": "/audio/3725cb56dda8.mp3", "p": "/p/hotel-check-in/"}, {"en": "Could you spell that for me?", "ko": "철자 좀 불러 주시겠어요?", "a": "/audio/dc79ae153136.mp3", "p": "/p/hotel-check-in/"}, {"en": "Can I get a medium latte?", "ko": "라떼 미디엄 하나 주세요.", "a": "/audio/0fa090bb36c5.mp3", "p": "/p/travel-cafe/"}, {"en": "For here, please.", "ko": "먹고 갈게요.", "a": "/audio/601244233a42.mp3", "p": "/p/travel-cafe/"}, {"en": "Medium, please.", "ko": "미디엄으로 주세요.", "a": "/audio/698568f8a587.mp3", "p": "/p/travel-cafe/"}, {"en": "No room, thanks.", "ko": "자리 안 남겨도 돼요.", "a": "/audio/168cac5d9ef1.mp3", "p": "/p/travel-cafe/"}, {"en": "It's Jun.", "ko": "준이에요.", "a": "/audio/90f42c09e24e.mp3", "p": "/p/travel-cafe/"}, {"en": "Can I get it with oat milk?", "ko": "오트 우유로 해 주실 수 있어요?", "a": "/audio/55e0a089cca8.mp3", "p": "/p/travel-cafe/"}, {"en": "To go, please.", "ko": "가져갈게요.", "a": "/audio/7b66f731ed79.mp3", "p": "/p/travel-cafe/"}, {"en": "Sorry, what was that?", "ko": "죄송해요, 뭐라고 하셨어요?", "a": "/audio/740c3a66f365.mp3", "p": "/p/travel-cafe/"}, {"en": "Actually, could I make that iced?", "ko": "아, 그거 아이스로 바꿀 수 있을까요?", "a": "/audio/94a0a263c7af.mp3", "p": "/p/travel-cafe/"}, {"en": "Can I get it decaf?", "ko": "디카페인으로 해 주실 수 있어요?", "a": "/audio/ce03ab0114ea.mp3", "p": "/p/travel-cafe/"}, {"en": "Could you make it less sweet?", "ko": "덜 달게 해 주실 수 있어요?", "a": "/audio/dff0e4e3c27a.mp3", "p": "/p/travel-cafe/"}, {"en": "Sorry, I think this one's not mine.", "ko": "죄송한데, 이건 제 것이 아닌 것 같아요.", "a": "/audio/6be07b7b3189.mp3", "p": "/p/travel-cafe/"}, {"en": "I ordered it with oat milk.", "ko": "오트 우유로 주문했어요.", "a": "/audio/98f94e4da122.mp3", "p": "/p/travel-cafe/"}, {"en": "That's it, thanks.", "ko": "그게 다예요, 감사해요.", "a": "/audio/e729cd07bd55.mp3", "p": "/p/travel-cafe/"}, {"en": "A table for two, please.", "ko": "두 명이요.", "a": "/audio/7d5cce758df3.mp3", "p": "/p/travel-restaurant/"}, {"en": "Just water for now, thanks.", "ko": "일단 물만 주세요.", "a": "/audio/d526ecbc049f.mp3", "p": "/p/travel-restaurant/"}, {"en": "Can we have a few more minutes?", "ko": "조금만 더 볼게요.", "a": "/audio/701752c711bf.mp3", "p": "/p/travel-restaurant/"}, {"en": "Everything's great, thanks.", "ko": "다 맛있어요, 감사해요.", "a": "/audio/09874c678661.mp3", "p": "/p/travel-restaurant/"}, {"en": "Can I get a box for this?", "ko": "남은 거 포장해 주시겠어요?", "a": "/audio/4e998d412b53.mp3", "p": "/p/travel-restaurant/"}, {"en": "What do you recommend?", "ko": "추천해 주실 만한 거 있어요?", "a": "/audio/46e110bf7fa8.mp3", "p": "/p/travel-restaurant/"}, {"en": "What comes with that?", "ko": "그거 시키면 뭐가 같이 나와요?", "a": "/audio/5f3daf12789c.mp3", "p": "/p/travel-restaurant/"}, {"en": "Can we split the check?", "ko": "나눠서 계산할 수 있을까요?", "a": "/audio/3838c4136528.mp3", "p": "/p/travel-restaurant/"}, {"en": "Could we get separate checks?", "ko": "계산서 따로 주시겠어요?", "a": "/audio/a6fca2c762b7.mp3", "p": "/p/travel-restaurant/"}, {"en": "Could I get this without onions?", "ko": "양파 빼고 주실 수 있어요?", "a": "/audio/9a5de39a46b8.mp3", "p": "/p/travel-restaurant/"}, {"en": "Can I get a refill?", "ko": "리필해 주실 수 있어요?", "a": "/audio/ec3b41e302ad.mp3", "p": "/p/travel-restaurant/"}, {"en": "Is the tip included?", "ko": "팁이 포함돼 있나요?", "a": "/audio/34e457ce063d.mp3", "p": "/p/travel-restaurant/"}, {"en": "I'm just looking, thanks.", "ko": "그냥 둘러보는 거예요.", "a": "/audio/67378a34845a.mp3", "p": "/p/shopping-checkout/"}, {"en": "Sure, where's the fitting room?", "ko": "네, 피팅룸이 어디예요?", "a": "/audio/b37389b163bb.mp3", "p": "/p/shopping-checkout/"}, {"en": "Yes, thanks.", "ko": "네, 감사해요.", "a": "/audio/77539deb55dc.mp3", "p": "/p/shopping-checkout/"}, {"en": "No bag, thanks.", "ko": "봉투는 괜찮아요.", "a": "/audio/4d877218612b.mp3", "p": "/p/shopping-checkout/"}, {"en": "Credit, please.", "ko": "신용카드요.", "a": "/audio/5d6566becae4.mp3", "p": "/p/shopping-checkout/"}, {"en": "Can I try this on?", "ko": "이거 입어 봐도 돼요?", "a": "/audio/146285a938a0.mp3", "p": "/p/shopping-checkout/"}, {"en": "Do you have this in a smaller size?", "ko": "이거 더 작은 사이즈 있어요?", "a": "/audio/0c6bfd361358.mp3", "p": "/p/shopping-checkout/"}, {"en": "Can I get a tax refund?", "ko": "세금 환급 받을 수 있어요?", "a": "/audio/e4a1550212a6.mp3", "p": "/p/shopping-checkout/"}, {"en": "Sorry, how much was that?", "ko": "죄송한데, 얼마라고 하셨죠?", "a": "/audio/2ff3520643ee.mp3", "p": "/p/shopping-checkout/"}, {"en": "I'd like to return this.", "ko": "이거 반품하고 싶어요.", "a": "/audio/649009cd902b.mp3", "p": "/p/shopping-checkout/"}, {"en": "Can I exchange this for a different size?", "ko": "다른 사이즈로 교환할 수 있어요?", "a": "/audio/cd15afdf1605.mp3", "p": "/p/shopping-checkout/"}, {"en": "I think I was charged twice.", "ko": "두 번 결제된 것 같아요.", "a": "/audio/1b7f49d3a7c2.mp3", "p": "/p/shopping-checkout/"}, {"en": "It was a gift, so I don't have the receipt.", "ko": "선물받은 거라 영수증이 없어요.", "a": "/audio/8fe05b603e29.mp3", "p": "/p/shopping-checkout/"}, {"en": "Do you have this in another color?", "ko": "이거 다른 색도 있어요?", "a": "/audio/0caeb03056a9.mp3", "p": "/p/shopping-checkout/"}, {"en": "I'd like to return these shoes.", "ko": "이 신발 반품하고 싶어요.", "a": "/audio/27c539c48284.mp3", "p": "/p/shopping-checkout/"}, {"en": "Straight for two blocks. Got it.", "ko": "두 블록 직진이요. 알겠어요.", "a": "/audio/18871e346b1b.mp3", "p": "/p/asking-directions/"}, {"en": "Left at the light, right?", "ko": "신호등에서 왼쪽, 맞죠?", "a": "/audio/53c1e4155947.mp3", "p": "/p/asking-directions/"}, {"en": "On my right. Thanks!", "ko": "오른쪽이요. 감사해요!", "a": "/audio/586c9ca307d3.mp3", "p": "/p/asking-directions/"}, {"en": "Ten minutes? Great.", "ko": "10분이요? 좋네요.", "a": "/audio/3d0afd028932.mp3", "p": "/p/asking-directions/"}, {"en": "Great, thank you so much!", "ko": "좋아요, 정말 감사해요!", "a": "/audio/b708ce685130.mp3", "p": "/p/asking-directions/"}, {"en": "Excuse me, how do I get to Central Station?", "ko": "실례지만, 중앙역은 어떻게 가요?", "a": "/audio/7ffcd37155f1.mp3", "p": "/p/asking-directions/"}, {"en": "Is it far from here?", "ko": "여기서 멀어요?", "a": "/audio/8f3621282074.mp3", "p": "/p/asking-directions/"}, {"en": "Could you show me on the map?", "ko": "지도에서 보여 주시겠어요?", "a": "/audio/45aeade590b6.mp3", "p": "/p/asking-directions/"}, {"en": "Is this the right way to the beach?", "ko": "해변 가는 길 이쪽 맞아요?", "a": "/audio/7eed513c7e36.mp3", "p": "/p/asking-directions/"}, {"en": "Where's the nearest restroom?", "ko": "가장 가까운 화장실이 어디예요?", "a": "/audio/f478149bff18.mp3", "p": "/p/asking-directions/"}, {"en": "Thank you so much!", "ko": "정말 감사해요!", "a": "/audio/a20c2f452119.mp3", "p": "/p/asking-directions/"}, {"en": "Sorry, left or right?", "ko": "죄송한데, 왼쪽이요, 오른쪽이요?", "a": "/audio/5921140c618f.mp3", "p": "/p/asking-directions/"}, {"en": "The pharmacy is across from the post office.", "ko": "약국은 우체국 맞은편에 있어요.", "a": "/audio/3489d4beeab3.mp3", "p": "/p/asking-directions/"}, {"en": "Keep going past the church, and it's on the corner.", "ko": "교회를 지나 계속 가면 모퉁이에 있어요.", "a": "/audio/05d5b2f7fcb8.mp3", "p": "/p/asking-directions/"}, {"en": "Is it on this side of the street?", "ko": "길 이쪽 편에 있어요?", "a": "/audio/c28ff2bd1705.mp3", "p": "/p/asking-directions/"}, {"en": "Should I turn at the second light?", "ko": "두 번째 신호등에서 꺾으면 돼요?", "a": "/audio/e6419e2f272d.mp3", "p": "/p/asking-directions/"}, {"en": "Is there a landmark I can look for?", "ko": "찾을 때 눈에 띄는 건물이 있을까요?", "a": "/audio/9b6537ee832b.mp3", "p": "/p/asking-directions/"}, {"en": "So I go back the way I came?", "ko": "그럼 왔던 길로 돌아가면 돼요?", "a": "/audio/2e16f30db523.mp3", "p": "/p/asking-directions/"}, {"en": "I lost my wallet.", "ko": "지갑을 잃어버렸어요.", "a": "/audio/a36fb4862686.mp3", "p": "/p/travel-trouble/"}, {"en": "I don't feel well.", "ko": "몸이 안 좋아요.", "a": "/audio/d2fa9fb5e929.mp3", "p": "/p/travel-trouble/"}, {"en": "I think I left it in the taxi.", "ko": "택시에 두고 내린 것 같아요.", "a": "/audio/7efaf267b298.mp3", "p": "/p/travel-trouble/"}, {"en": "Can you put me on the next flight?", "ko": "다음 항공편으로 바꿔 주실 수 있어요?", "a": "/audio/a0b1cf71bc2f.mp3", "p": "/p/travel-trouble/"}, {"en": "Yes, I do.", "ko": "네, 있어요.", "a": "/audio/06b0f7856558.mp3", "p": "/p/travel-trouble/"}, {"en": "Please call an ambulance.", "ko": "구급차 좀 불러 주세요.", "a": "/audio/f2d0b7535a4e.mp3", "p": "/p/travel-trouble/"}, {"en": "I need a police report for my insurance.", "ko": "보험 때문에 경찰 확인서가 필요해요.", "a": "/audio/1cdcec311b9d.mp3", "p": "/p/travel-trouble/"}, {"en": "Yes, here it is. Thank you so much.", "ko": "네, 여기요. 정말 감사해요.", "a": "/audio/b84712598edb.mp3", "p": "/p/travel-trouble/"}, {"en": "I need help, please.", "ko": "도와주세요.", "a": "/audio/5a42072ab818.mp3", "p": "/p/travel-trouble/"}, {"en": "My bag was stolen.", "ko": "가방을 도둑맞았어요.", "a": "/audio/038fa66d8b8f.mp3", "p": "/p/travel-trouble/"}, {"en": "Someone took my phone from my pocket.", "ko": "누가 주머니에서 폰을 가져갔어요.", "a": "/audio/d9920c4c66ef.mp3", "p": "/p/travel-trouble/"}, {"en": "It happened about ten minutes ago.", "ko": "10분쯤 전에 그랬어요.", "a": "/audio/4a5e7b6af905.mp3", "p": "/p/travel-trouble/"}, {"en": "It's a black leather wallet.", "ko": "검은색 가죽 지갑이에요.", "a": "/audio/cb7f8253e668.mp3", "p": "/p/travel-trouble/"}, {"en": "I need to cancel my credit cards.", "ko": "신용카드를 정지해야 해요.", "a": "/audio/d744412011cb.mp3", "p": "/p/travel-trouble/"}, {"en": "I lost it somewhere around the market.", "ko": "시장 근처 어딘가에서 잃어버렸어요.", "a": "/audio/4b39e88ecb8a.mp3", "p": "/p/travel-trouble/"}, {"en": "Can I get a latte?", "ko": "라떼 하나 주세요.", "a": "/audio/e56099d04301.mp3", "p": "/p/cafe-order/"}, {"en": "I'll have an iced Americano.", "ko": "아이스 아메리카노로 할게요.", "a": "/audio/74a5a90bf20b.mp3", "p": "/p/cafe-order/"}, {"en": "Could I get a small cappuccino, please?", "ko": "스몰 카푸치노 하나 주시겠어요?", "a": "/audio/895c6d76cea0.mp3", "p": "/p/cafe-order/"}, {"en": "For here or to go?", "ko": "드시고 가세요, 가져가세요?", "a": "/audio/504bb2f05df0.mp3", "p": "/p/cafe-order/"}, {"en": "Can I get a name for the order?", "ko": "주문하신 분 성함이요?", "a": "/audio/c1f1eda48450.mp3", "p": "/p/cafe-order/"}, {"en": "Anything else?", "ko": "더 필요한 거 있으세요?", "a": "/audio/5e71c33b942c.mp3", "p": "/p/cafe-order/"}, {"en": "Can I get that with oat milk?", "ko": "오트 밀크로 바꿔 주실 수 있어요?", "a": "/audio/a23db8331ef9.mp3", "p": "/p/cafe-order/"}, {"en": "Could I get it iced instead?", "ko": "대신 아이스로 받을 수 있을까요?", "a": "/audio/b8eef6ce92e2.mp3", "p": "/p/cafe-order/"}, {"en": "Can I get a medium latte with oat milk?", "ko": "오트 밀크로 미디엄 라떼 하나 주세요.", "a": "/audio/12ee80461d07.mp3", "p": "/p/cafe-order/"}, {"en": "Iced, please. And that's it.", "ko": "아이스로 주세요. 그거면 돼요.", "a": "/audio/c433aa52622a.mp3", "p": "/p/cafe-order/"}, {"en": "What size would you like?", "ko": "사이즈는 어떤 걸로 드릴까요?", "a": "/audio/92bf303ab918.mp3", "p": "/p/cafe-order/"}, {"en": "Is that for here?", "ko": "드시고 가시는 거죠?", "a": "/audio/654bcf6b906c.mp3", "p": "/p/cafe-order/"}, {"en": "Your order will be ready at the end of the counter.", "ko": "주문하신 음료는 카운터 끝에서 받으시면 돼요.", "a": "/audio/301cd4983fa4.mp3", "p": "/p/cafe-order/"}, {"en": "Table for two, please.", "ko": "두 명이에요.", "a": "/audio/38381e2715bf.mp3", "p": "/p/restaurant/"}, {"en": "I'll have the steak, please.", "ko": "스테이크로 할게요.", "a": "/audio/9d6f1b782b96.mp3", "p": "/p/restaurant/"}, {"en": "Can we get the check, please?", "ko": "계산서 주시겠어요?", "a": "/audio/74ba9bcbc375.mp3", "p": "/p/restaurant/"}, {"en": "Separate checks, please.", "ko": "따로 계산해 주세요.", "a": "/audio/fcb812e23018.mp3", "p": "/p/restaurant/"}, {"en": "I'm sorry, I think I ordered the chicken.", "ko": "죄송한데, 제가 치킨을 주문한 것 같아요.", "a": "/audio/b0f17edf5eee.mp3", "p": "/p/restaurant/"}, {"en": "Does this have any nuts in it?", "ko": "이거 견과류 들어가요?", "a": "/audio/baffe3b2c6de.mp3", "p": "/p/restaurant/"}, {"en": "Could I get it without onions?", "ko": "양파 빼고 주실 수 있어요?", "a": "/audio/ba0bec12eeb8.mp3", "p": "/p/restaurant/"}, {"en": "Could we get some more water, please?", "ko": "물 좀 더 주시겠어요?", "a": "/audio/05d348f5897d.mp3", "p": "/p/restaurant/"}, {"en": "We have a reservation under Kim.", "ko": "김으로 예약했어요.", "a": "/audio/1430af798d88.mp3", "p": "/p/restaurant/"}, {"en": "Could we sit by the window?", "ko": "창가 자리에 앉을 수 있을까요?", "a": "/audio/56946f5bc18e.mp3", "p": "/p/restaurant/"}, {"en": "How long is the wait?", "ko": "얼마나 기다려야 해요?", "a": "/audio/83588e6d1844.mp3", "p": "/p/restaurant/"}, {"en": "I have a headache.", "ko": "머리가 아파요.", "a": "/audio/734b1e8fc676.mp3", "p": "/p/doctor/"}, {"en": "I have a sore throat.", "ko": "목이 아파요.", "a": "/audio/e4bcc23ed230.mp3", "p": "/p/doctor/"}, {"en": "I have a fever.", "ko": "열이 나요.", "a": "/audio/cb7c52a8c331.mp3", "p": "/p/doctor/"}, {"en": "I have a runny nose.", "ko": "콧물이 나요.", "a": "/audio/4ee590f930a1.mp3", "p": "/p/doctor/"}, {"en": "I have a stomachache.", "ko": "배가 아파요.", "a": "/audio/bb11e31a3747.mp3", "p": "/p/doctor/"}, {"en": "I've been coughing for three days.", "ko": "사흘째 기침이 나요.", "a": "/audio/7443cd1298f8.mp3", "p": "/p/doctor/"}, {"en": "It started yesterday.", "ko": "어제부터 시작됐어요.", "a": "/audio/63aa9b6f6363.mp3", "p": "/p/doctor/"}, {"en": "It hurts here.", "ko": "여기가 아파요.", "a": "/audio/184d0c2616f9.mp3", "p": "/p/doctor/"}, {"en": "It hurts when I swallow.", "ko": "삼킬 때 아파요.", "a": "/audio/b6d6c3862af7.mp3", "p": "/p/doctor/"}, {"en": "Do I need a prescription for this?", "ko": "이거 처방전이 필요한가요?", "a": "/audio/47ca3ab5c04d.mp3", "p": "/p/doctor/"}, {"en": "I'm allergic to penicillin.", "ko": "페니실린 알레르기가 있어요.", "a": "/audio/18117d91e82a.mp3", "p": "/p/doctor/"}, {"en": "How often should I take this?", "ko": "이거 얼마나 자주 먹어야 해요?", "a": "/audio/5fed7f31e7f8.mp3", "p": "/p/doctor/"}, {"en": "I've had a sore throat and a fever since Monday.", "ko": "월요일부터 목이 아프고 열이 나요.", "a": "/audio/1f0e88dce493.mp3", "p": "/p/doctor/"}, {"en": "Just some cold medicine. And I'm allergic to penicillin.", "ko": "감기약만 조금요. 그리고 페니실린 알레르기가 있어요.", "a": "/audio/d619cb2ed4b6.mp3", "p": "/p/doctor/"}, {"en": "Take one tablet twice a day.", "ko": "하루 두 번, 한 알씩 드세요.", "a": "/audio/e757ee5c72ba.mp3", "p": "/p/doctor/"}, {"en": "Take it with food.", "ko": "식사와 함께 드세요.", "a": "/audio/3941c07962d8.mp3", "p": "/p/doctor/"}, {"en": "It may cause drowsiness.", "ko": "졸릴 수 있어요.", "a": "/audio/50c8f0f7428e.mp3", "p": "/p/doctor/"}, {"en": "Do not take more than four in 24 hours.", "ko": "24시간 동안 네 알 넘게 드시면 안 돼요.", "a": "/audio/88a965581b28.mp3", "p": "/p/doctor/"}, {"en": "Could you speak a little more slowly?", "ko": "조금만 더 천천히 말씀해 주시겠어요?", "a": "/audio/a8a27020a5de.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you write it down for me?", "ko": "적어 주실 수 있을까요?", "a": "/audio/ebfa6e7f1e1c.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Just to make sure, you mean Tuesday?", "ko": "확인차 여쭤볼게요, 화요일 말씀하신 거죠?", "a": "/audio/1533df62dbc0.mp3", "p": "/p/ask-to-repeat/"}, {"en": "So you're saying I need to come back tomorrow?", "ko": "그러니까 내일 다시 와야 한다는 말씀이시죠?", "a": "/audio/c7a4e53071c4.mp3", "p": "/p/ask-to-repeat/"}, {"en": "English isn't my first language, so please bear with me.", "ko": "영어가 모국어가 아니라서 조금만 양해해 주세요.", "a": "/audio/24dbe40d0ffd.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, what time did you say?", "ko": "죄송한데, 몇 시라고 하셨죠?", "a": "/audio/102b9a0dc7da.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, I missed the last part.", "ko": "죄송해요, 마지막 부분을 놓쳤어요.", "a": "/audio/c1cc8265b944.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Which gate was that again?", "ko": "몇 번 게이트라고 하셨죠?", "a": "/audio/3099f4a5c6a8.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Did you say fifteen or fifty?", "ko": "15라고 하셨어요, 50이라고 하셨어요?", "a": "/audio/8181e2187ba7.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Is that one-five or five-zero?", "ko": "1, 5예요, 아니면 5, 0이에요?", "a": "/audio/12c235825766.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, I didn't catch that.", "ko": "죄송해요, 잘 못 들었어요.", "a": "/audio/1e03778a85b2.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Excuse me, can I get past?", "ko": "실례합니다, 좀 지나갈게요.", "a": "/audio/5ef882c086f2.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, is this seat taken?", "ko": "저기요, 여기 자리 있어요?", "a": "/audio/aa8b0a928d7b.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Oh, sorry! Are you okay?", "ko": "앗, 죄송해요! 괜찮으세요?", "a": "/audio/09f37eb74341.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Sorry, my mistake.", "ko": "죄송해요, 제 실수예요.", "a": "/audio/a63053301c1c.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Sorry? I didn't catch that.", "ko": "네? 잘 못 들었어요.", "a": "/audio/70a2bf568862.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Could you say that again?", "ko": "다시 한번 말씀해 주시겠어요?", "a": "/audio/cf2a2748ec8e.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, is this the line for the bus?", "ko": "실례지만, 여기가 버스 줄인가요?", "a": "/audio/084fa9cdc884.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Is this the line for the bus?", "ko": "여기 버스 타는 줄이에요?", "a": "/audio/d8fd4df13ec8.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, coming through.", "ko": "실례합니다, 좀 지나갈게요.", "a": "/audio/7314495260f4.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me, do you work here?", "ko": "저기요, 여기 직원이세요?", "a": "/audio/465783e27e99.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Excuse me for a second.", "ko": "잠깐 실례할게요.", "a": "/audio/ea45b7da3a2b.mp3", "p": "/p/excuse-me-sorry/"}, {"en": "Good, how about you?", "ko": "좋아, 너는?", "a": "/audio/a3199443bc97.mp3", "p": "/p/how-are-you/"}, {"en": "Pretty good, you?", "ko": "꽤 괜찮아, 너는?", "a": "/audio/103608212b3c.mp3", "p": "/p/how-are-you/"}, {"en": "Not bad. How's it going with you?", "ko": "나쁘지 않아. 너는 어때?", "a": "/audio/2ece0aaaa361.mp3", "p": "/p/how-are-you/"}, {"en": "Can't complain.", "ko": "나쁘지 않아.", "a": "/audio/68c6d8ead56b.mp3", "p": "/p/how-are-you/"}, {"en": "Hanging in there.", "ko": "그럭저럭 버티는 중이야.", "a": "/audio/4fa9482ee946.mp3", "p": "/p/how-are-you/"}, {"en": "Not much. You?", "ko": "별일 없어. 너는?", "a": "/audio/783c4545ecda.mp3", "p": "/p/how-are-you/"}, {"en": "Just chilling.", "ko": "그냥 쉬고 있어.", "a": "/audio/e83ec749ac20.mp3", "p": "/p/how-are-you/"}, {"en": "Tell me about it. Hang in there!", "ko": "내 말이. 힘내!", "a": "/audio/222813ebc08f.mp3", "p": "/p/how-are-you/"}, {"en": "How have you been?", "ko": "그동안 잘 지냈어?", "a": "/audio/f67e8f5be362.mp3", "p": "/p/how-are-you/"}, {"en": "How's your day going?", "ko": "오늘 하루 어때요?", "a": "/audio/a0c64a342ed1.mp3", "p": "/p/how-are-you/"}, {"en": "How was your weekend?", "ko": "주말 어땠어?", "a": "/audio/ddb0b90fcb14.mp3", "p": "/p/how-are-you/"}, {"en": "Good! Just got back from a short trip.", "ko": "좋았어! 짧게 여행 다녀왔어.", "a": "/audio/67b1feb44240.mp3", "p": "/p/how-are-you/"}, {"en": "How's it going?", "ko": "잘 지내?", "a": "/audio/7f64e5716842.mp3", "p": "/p/how-are-you/"}, {"en": "How are you doing?", "ko": "어떻게 지내요?", "a": "/audio/254fc38dc274.mp3", "p": "/p/how-are-you/"}, {"en": "How's everything?", "ko": "다 괜찮아요? 별일 없죠?", "a": "/audio/5fabda612a15.mp3", "p": "/p/how-are-you/"}], "work": [{"en": "Could you walk me through the process?", "ko": "절차를 차근차근 설명해 주시겠어요?", "a": "/audio/a8d2b795cd09.mp3", "p": "/p/walk-me-through/"}, {"en": "Can you walk me through how to fill out this form?", "ko": "이 서류 어떻게 작성하는지 하나씩 알려 주실래요?", "a": "/audio/53329b03fe20.mp3", "p": "/p/walk-me-through/"}, {"en": "Sure, let me walk you through it.", "ko": "네, 제가 하나씩 설명해 드릴게요.", "a": "/audio/93fde242e6ad.mp3", "p": "/p/walk-me-through/"}, {"en": "Could you show me how to do this?", "ko": "이거 어떻게 하는지 보여 주시겠어요?", "a": "/audio/ff820177224c.mp3", "p": "/p/walk-me-through/"}, {"en": "Could you break it down for me?", "ko": "좀 더 쉽게 나눠서 설명해 주시겠어요?", "a": "/audio/3f489622edf5.mp3", "p": "/p/walk-me-through/"}, {"en": "Could you walk me through the steps to open an account?", "ko": "계좌 여는 단계를 하나씩 알려 주시겠어요?", "a": "/audio/be9b13527044.mp3", "p": "/p/walk-me-through/"}, {"en": "Would you mind walking me through the new software?", "ko": "새 프로그램 쓰는 법 좀 차근차근 알려 주실 수 있을까요?", "a": "/audio/081372597af3.mp3", "p": "/p/walk-me-through/"}, {"en": "Can you walk me through what happened?", "ko": "무슨 일이 있었는지 처음부터 말해 줄래?", "a": "/audio/6e14f5630716.mp3", "p": "/p/walk-me-through/"}, {"en": "I've never used it before. Could you walk me through it?", "ko": "처음 써 봐서요. 하나씩 알려 주시겠어요?", "a": "/audio/5cb4aa1c9d3a.mp3", "p": "/p/walk-me-through/"}, {"en": "Got it. And then what?", "ko": "알겠어요. 그다음엔요?", "a": "/audio/c8e5239476dc.mp3", "p": "/p/walk-me-through/"}, {"en": "I'll walk you through it after lunch.", "ko": "점심 먹고 차근차근 알려 줄게요.", "a": "/audio/5f9e422d5558.mp3", "p": "/p/walk-me-through/"}, {"en": "Let me know when you get home.", "ko": "집에 도착하면 알려줘.", "a": "/audio/861916b96bd2.mp3", "p": "/p/keep-me-posted/"}, {"en": "Keep me posted on the interview!", "ko": "면접 어떻게 되는지 계속 알려줘!", "a": "/audio/427637f49467.mp3", "p": "/p/keep-me-posted/"}, {"en": "I'll keep you posted.", "ko": "상황 보고 계속 알려줄게.", "a": "/audio/fa730ebfd868.mp3", "p": "/p/keep-me-posted/"}, {"en": "Keep me in the loop.", "ko": "나도 계속 알 수 있게 공유해 줘.", "a": "/audio/1b019915db31.mp3", "p": "/p/keep-me-posted/"}, {"en": "I'll loop you in.", "ko": "너도 포함해서 공유할게.", "a": "/audio/949de19fcb1a.mp3", "p": "/p/keep-me-posted/"}, {"en": "Keep me posted on how your mom is doing.", "ko": "어머님 상태 어떠신지 계속 알려 줘.", "a": "/audio/a545d2152146.mp3", "p": "/p/keep-me-posted/"}, {"en": "Please keep me posted on any changes to the schedule.", "ko": "일정이 바뀌면 계속 알려 주세요.", "a": "/audio/afce14bbc7e4.mp3", "p": "/p/keep-me-posted/"}, {"en": "I'll keep you posted on the apartment.", "ko": "집 구하는 거 어떻게 되는지 알려 줄게.", "a": "/audio/b430bf661f35.mp3", "p": "/p/keep-me-posted/"}, {"en": "How did it go?", "ko": "어땠어?", "a": "/audio/d0f387a768df.mp3", "p": "/p/keep-me-posted/"}, {"en": "Fingers crossed! Keep me posted.", "ko": "잘되길 빌게! 소식 계속 알려 줘.", "a": "/audio/a3ec9905fbb7.mp3", "p": "/p/keep-me-posted/"}, {"en": "Quick update: the meeting has been moved to Wednesday.", "ko": "짧게 공유드려요. 회의가 수요일로 옮겨졌어요.", "a": "/audio/349d1a402376.mp3", "p": "/p/keep-me-posted/"}, {"en": "Can you send me the file? Sure, I'm on it.", "ko": "파일 보내줄 수 있어요? 네, 바로 보낼게요.", "a": "/audio/d4c83fe6ead0.mp3", "p": "/p/im-on-it/"}, {"en": "Don't worry, I'm on it.", "ko": "걱정 마, 내가 처리하고 있어.", "a": "/audio/08489b4f6bd8.mp3", "p": "/p/im-on-it/"}, {"en": "We're on it.", "ko": "저희가 처리하고 있습니다.", "a": "/audio/8748313c19aa.mp3", "p": "/p/im-on-it/"}, {"en": "Will do.", "ko": "그렇게 할게요.", "a": "/audio/7921cfedd871.mp3", "p": "/p/im-on-it/"}, {"en": "Consider it done.", "ko": "다 된 걸로 생각하세요.", "a": "/audio/98ce5ed8fe78.mp3", "p": "/p/im-on-it/"}, {"en": "I'm on it. I'll send them over by eleven.", "ko": "바로 할게요. 11시까지 보내 드릴게요.", "a": "/audio/2b8444118335.mp3", "p": "/p/im-on-it/"}, {"en": "Is anyone on this?", "ko": "이거 누가 맡고 있어요?", "a": "/audio/ae3cc11677be.mp3", "p": "/p/im-on-it/"}, {"en": "Don't worry, Sarah's on it.", "ko": "걱정 마세요, 세라가 맡고 있어요.", "a": "/audio/eb8621a5d083.mp3", "p": "/p/im-on-it/"}, {"en": "Still on it. I'll update you by five.", "ko": "아직 하는 중이에요. 5시까지 알려 드릴게요.", "a": "/audio/1711adede88f.mp3", "p": "/p/im-on-it/"}, {"en": "Almost done. Just checking a few numbers.", "ko": "거의 다 했어요. 숫자 몇 개만 확인하고 있어요.", "a": "/audio/7b5905e5e2b1.mp3", "p": "/p/im-on-it/"}, {"en": "I'm on top of it.", "ko": "제가 잘 챙기고 있어요.", "a": "/audio/626952be1be7.mp3", "p": "/p/im-on-it/"}, {"en": "Got your message. I'm on it.", "ko": "메시지 받았어요. 바로 할게요.", "a": "/audio/372b9943b135.mp3", "p": "/p/im-on-it/"}, {"en": "Can you hear me okay?", "ko": "제 목소리 잘 들리세요?", "a": "/audio/2a2166929e2d.mp3", "p": "/p/video-call/"}, {"en": "You're on mute.", "ko": "음소거 되어 있어요.", "a": "/audio/6ff2a890a8cb.mp3", "p": "/p/video-call/"}, {"en": "You're breaking up.", "ko": "소리가 끊겨요.", "a": "/audio/201945180770.mp3", "p": "/p/video-call/"}, {"en": "Can you see my screen?", "ko": "제 화면 보이세요?", "a": "/audio/6e8288b09251.mp3", "p": "/p/video-call/"}, {"en": "Sorry, go ahead.", "ko": "죄송해요, 먼저 말씀하세요.", "a": "/audio/d83c70e0cbe1.mp3", "p": "/p/video-call/"}, {"en": "Sorry, I have a hard stop at three.", "ko": "죄송해요, 3시에는 꼭 나가야 해요.", "a": "/audio/48bb717b6a68.mp3", "p": "/p/video-call/"}, {"en": "Let's pick this up next time.", "ko": "이건 다음에 이어서 해요.", "a": "/audio/a73f0260dc32.mp3", "p": "/p/video-call/"}, {"en": "Yes, loud and clear.", "ko": "네, 아주 잘 들려요.", "a": "/audio/1df35c19e48d.mp3", "p": "/p/video-call/"}, {"en": "Oh, sorry! Can you hear me now?", "ko": "앗, 죄송해요! 이제 들리세요?", "a": "/audio/50b4caebe3db.mp3", "p": "/p/video-call/"}, {"en": "Can I jump in here for a second?", "ko": "잠깐 한마디 해도 될까요?", "a": "/audio/4ee14db70831.mp3", "p": "/p/video-call/"}, {"en": "Sorry, could you repeat the last part?", "ko": "죄송한데 마지막 부분 다시 말씀해 주시겠어요?", "a": "/audio/17a29652aa70.mp3", "p": "/p/video-call/"}, {"en": "I'll drop the link in the chat.", "ko": "링크는 채팅창에 올릴게요.", "a": "/audio/93eacfa14a3b.mp3", "p": "/p/video-call/"}, {"en": "Let's wrap up here.", "ko": "여기서 마무리하죠.", "a": "/audio/01cf9beb740c.mp3", "p": "/p/video-call/"}, {"en": "Sorry, I missed that. Could you say it again?", "ko": "죄송해요, 놓쳤어요. 다시 말씀해 주시겠어요?", "a": "/audio/3454932e769c.mp3", "p": "/p/video-call/"}, {"en": "I need to hop off a few minutes early today.", "ko": "오늘은 몇 분 일찍 나가 봐야 해요.", "a": "/audio/7ae22dff01c7.mp3", "p": "/p/video-call/"}, {"en": "Sorry, I'm swamped today. Rain check?", "ko": "미안, 오늘 일이 너무 많아. 다음에 하자!", "a": "/audio/a0e62c43b0e8.mp3", "p": "/p/swamped/"}, {"en": "I'm swamped with emails.", "ko": "이메일이 산더미처럼 쌓였어.", "a": "/audio/5ff0466c189c.mp3", "p": "/p/swamped/"}, {"en": "We've been swamped with orders since the sale.", "ko": "세일 이후로 주문이 몰려서 정신없어.", "a": "/audio/71e1a6570fc2.mp3", "p": "/p/swamped/"}, {"en": "I'm slammed.", "ko": "일에 두들겨 맞는 느낌. 직장 동료끼리 자주 써요.", "a": "/audio/b72307cf1dd9.mp3", "p": "/p/swamped/"}, {"en": "I have a lot on my plate.", "ko": "접시에 음식이 가득 = 해야 할 일이 많다.", "a": "/audio/c78200c1639a.mp3", "p": "/p/swamped/"}, {"en": "I'm up to my ears in work.", "ko": "일이 귀까지 차올랐다 = 일에 파묻혔다.", "a": "/audio/4de0e6a5c4c6.mp3", "p": "/p/swamped/"}, {"en": "I'd love to, but I'm swamped today. Rain check?", "ko": "그러고 싶은데 오늘 일이 너무 많아. 다음에 할까?", "a": "/audio/5eb9ccf6c32a.mp3", "p": "/p/swamped/"}, {"en": "Thursday works. Thanks!", "ko": "목요일 좋아. 고마워!", "a": "/audio/364c95d83953.mp3", "p": "/p/swamped/"}, {"en": "Things have been hectic, but I'll get back to you by Friday.", "ko": "요즘 좀 정신없지만 금요일까지 답드릴게요.", "a": "/audio/c6df6c9c1f1a.mp3", "p": "/p/swamped/"}, {"en": "Work's been crazy lately.", "ko": "요즘 일이 장난 아니야.", "a": "/audio/e0ddd48472d6.mp3", "p": "/p/swamped/"}, {"en": "Sorry for the late reply. I've been swamped this week.", "ko": "답장 늦어서 미안. 이번 주 너무 바빴어.", "a": "/audio/49aba4c2269c.mp3", "p": "/p/swamped/"}, {"en": "Anything I can help with?", "ko": "내가 도와줄 거 있어?", "a": "/audio/2e03b54ca650.mp3", "p": "/p/swamped/"}, {"en": "Hang in there. The weekend is almost here.", "ko": "조금만 버텨. 주말 거의 다 왔어.", "a": "/audio/f54dfec8f57c.mp3", "p": "/p/swamped/"}, {"en": "No rush. Get back to me when you can.", "ko": "급한 거 아니야. 여유 될 때 답 줘.", "a": "/audio/6396f2b10474.mp3", "p": "/p/swamped/"}, {"en": "So we meet at seven and go together. Does that make sense?", "ko": "그러니까 7시에 만나서 같이 가는 거야. 이해돼?", "a": "/audio/d4df42859510.mp3", "p": "/p/make-sense/"}, {"en": "That makes sense.", "ko": "아, 그렇구나. 이해돼.", "a": "/audio/25140380028c.mp3", "p": "/p/make-sense/"}, {"en": "It doesn't make sense.", "ko": "그건 말이 안 돼.", "a": "/audio/74fdd2496893.mp3", "p": "/p/make-sense/"}, {"en": "Yeah, makes sense.", "ko": "응, 이해했어.", "a": "/audio/cba2b8390fb7.mp3", "p": "/p/make-sense/"}, {"en": "Not really. Could you explain that again?", "ko": "잘 모르겠어. 다시 설명해 줄래?", "a": "/audio/98697388f098.mp3", "p": "/p/make-sense/"}, {"en": "Mostly. Do I need to sign it too?", "ko": "대부분요. 서명도 해야 하나요?", "a": "/audio/e1aca9f66afd.mp3", "p": "/p/make-sense/"}, {"en": "Got it. That makes sense now.", "ko": "알겠어요. 이제 이해돼요.", "a": "/audio/f4b8f5cc6217.mp3", "p": "/p/make-sense/"}, {"en": "It makes sense to leave early.", "ko": "일찍 출발하는 게 합리적이야.", "a": "/audio/2b7af188a375.mp3", "p": "/p/make-sense/"}, {"en": "Now it all makes sense.", "ko": "이제야 다 이해가 되네.", "a": "/audio/18841cc4562a.mp3", "p": "/p/make-sense/"}, {"en": "I can't make sense of this chart.", "ko": "이 표가 무슨 말인지 모르겠어.", "a": "/audio/80667aad2599.mp3", "p": "/p/make-sense/"}, {"en": "Let's meet at six. Sounds good!", "ko": "6시에 만나자. 좋아!", "a": "/audio/37e820e889b3.mp3", "p": "/p/sounds-good/"}, {"en": "How about Friday? That works for me.", "ko": "금요일 어때? 난 괜찮아.", "a": "/audio/01d597c46b71.mp3", "p": "/p/sounds-good/"}, {"en": "We'll grab dinner after the movie. Sounds like a plan.", "ko": "영화 보고 저녁 먹자. 좋은 계획이네, 그러자.", "a": "/audio/df6f8ac321e1.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds great!", "ko": "너무 좋아!", "a": "/audio/f84b39c21589.mp3", "p": "/p/sounds-good/"}, {"en": "Works for me.", "ko": "난 좋아.", "a": "/audio/95386e5da8c3.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds good. I'll update the invite.", "ko": "좋아요. 일정 초대를 바꿀게요.", "a": "/audio/7d32284fbcaa.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds good. See you at three.", "ko": "좋아요. 3시에 봐요.", "a": "/audio/371685c21481.mp3", "p": "/p/sounds-good/"}, {"en": "A picnic by the river? Sounds fun!", "ko": "강가에서 소풍? 재밌겠다!", "a": "/audio/cfd17c5fbc35.mp3", "p": "/p/sounds-good/"}, {"en": "You worked all weekend? That sounds tough.", "ko": "주말 내내 일했어? 힘들었겠다.", "a": "/audio/db9a05d95fe3.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds like a lot of work.", "ko": "일이 많겠네.", "a": "/audio/22ab80cd7110.mp3", "p": "/p/sounds-good/"}, {"en": "That sounds amazing. I'm so happy for you.", "ko": "진짜 멋지다. 정말 잘됐다.", "a": "/audio/efadc152cf58.mp3", "p": "/p/sounds-good/"}, {"en": "Pizza and a movie tonight? Sounds perfect.", "ko": "오늘 밤 피자랑 영화? 완벽해.", "a": "/audio/93d445f33127.mp3", "p": "/p/sounds-good/"}, {"en": "Sounds good to me. Let's do it.", "ko": "난 좋아. 그렇게 하자.", "a": "/audio/03b81946d964.mp3", "p": "/p/sounds-good/"}, {"en": "Are you free this Friday?", "ko": "이번 주 금요일에 시간 돼?", "a": "/audio/6d06919520f0.mp3", "p": "/p/this-vs-next/"}, {"en": "Let's meet next Friday.", "ko": "다음 주 금요일에 만나자.", "a": "/audio/e82962eb9049.mp3", "p": "/p/this-vs-next/"}, {"en": "Do you mean this Friday or next Friday?", "ko": "이번 주 금요일 말하는 거야, 다음 주 금요일 말하는 거야?", "a": "/audio/cc10ef8f4c89.mp3", "p": "/p/this-vs-next/"}, {"en": "How about Friday the 16th?", "ko": "16일 금요일 어때요?", "a": "/audio/2b661ce251b9.mp3", "p": "/p/this-vs-next/"}, {"en": "Let's do Friday, October 23rd.", "ko": "10월 23일 금요일로 하죠.", "a": "/audio/eeb39edacc3b.mp3", "p": "/p/this-vs-next/"}, {"en": "I'll see you a week from Friday.", "ko": "이번 금요일에서 일주일 뒤에 봐요.", "a": "/audio/7f050b2fa7cc.mp3", "p": "/p/this-vs-next/"}, {"en": "I saw her this past Friday.", "ko": "지난 금요일에 그 친구 봤어.", "a": "/audio/88e85018a4a2.mp3", "p": "/p/this-vs-next/"}, {"en": "Let's meet the Friday after next.", "ko": "다다음 주 금요일에 만나자.", "a": "/audio/82434673e524.mp3", "p": "/p/this-vs-next/"}, {"en": "Are you free this weekend?", "ko": "이번 주말에 시간 돼?", "a": "/audio/af9d87ab70df.mp3", "p": "/p/this-vs-next/"}, {"en": "I mean the weekend after this one.", "ko": "이번 주말 말고 그다음 주말 말하는 거야.", "a": "/audio/913ac4db751a.mp3", "p": "/p/this-vs-next/"}, {"en": "Sure. Just to confirm, is that the 20th?", "ko": "좋아요. 확인차 여쭤보는데, 20일 말씀하시는 거죠?", "a": "/audio/1f9ae1459cb4.mp3", "p": "/p/this-vs-next/"}, {"en": "Great. I'll put it on my calendar.", "ko": "좋아요. 캘린더에 넣어 둘게요.", "a": "/audio/d55a5cbe66bd.mp3", "p": "/p/this-vs-next/"}, {"en": "Hi Jenny,", "ko": "안녕하세요 제니,", "a": "/audio/16b692768f70.mp3", "p": "/p/email-phrases/"}, {"en": "I hope you're doing well.", "ko": "잘 지내시죠?", "a": "/audio/397a66777904.mp3", "p": "/p/email-phrases/"}, {"en": "Thanks for getting back to me.", "ko": "답장 주셔서 감사해요.", "a": "/audio/2a973e426299.mp3", "p": "/p/email-phrases/"}, {"en": "I'm writing to ask about the schedule.", "ko": "일정 관련해서 여쭤보려고 메일 드려요.", "a": "/audio/2b9f5ef9df13.mp3", "p": "/p/email-phrases/"}, {"en": "Just following up on my last email.", "ko": "지난번 메일 관련해서 다시 연락드려요.", "a": "/audio/db0c6533a416.mp3", "p": "/p/email-phrases/"}, {"en": "I've attached the file.", "ko": "파일 첨부했어요.", "a": "/audio/cfcebabd1a25.mp3", "p": "/p/email-phrases/"}, {"en": "Let me know if you have any questions.", "ko": "궁금한 점 있으면 알려 주세요.", "a": "/audio/c5d8109899e9.mp3", "p": "/p/email-phrases/"}, {"en": "Thanks in advance.", "ko": "미리 감사드려요.", "a": "/audio/2ce9c04725d4.mp3", "p": "/p/email-phrases/"}, {"en": "Sorry for the late reply.", "ko": "답장이 늦어서 죄송해요.", "a": "/audio/45856e9f49b6.mp3", "p": "/p/email-phrases/"}, {"en": "Would Thursday afternoon work for you?", "ko": "목요일 오후 괜찮으세요?", "a": "/audio/b9ef822d19d4.mp3", "p": "/p/email-phrases/"}, {"en": "Could you confirm by Friday?", "ko": "금요일까지 확인해 주실 수 있을까요?", "a": "/audio/8eaab5cbf303.mp3", "p": "/p/email-phrases/"}, {"en": "Just a quick reminder that the deadline is tomorrow.", "ko": "마감이 내일이라 한 번 더 말씀드려요.", "a": "/audio/18b00b512e35.mp3", "p": "/p/email-phrases/"}, {"en": "Meeting schedule for next week", "ko": "다음 주 회의 일정", "a": "/audio/8a84da03e0b0.mp3", "p": "/p/email-phrases/"}, {"en": "Question about the invoice", "ko": "청구서 관련 문의", "a": "/audio/b8026cfea0ae.mp3", "p": "/p/email-phrases/"}, {"en": "Quick question", "ko": "간단한 질문", "a": "/audio/1ea5ffd8cc82.mp3", "p": "/p/email-phrases/"}], "life": [{"en": "Sorry, could you say that again?", "ko": "죄송한데 다시 한번 말씀해 주시겠어요?", "a": "/audio/80a24d81be29.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you speak a little more slowly?", "ko": "조금만 더 천천히 말씀해 주시겠어요?", "a": "/audio/a8a27020a5de.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you spell that for me?", "ko": "철자를 불러 주시겠어요?", "a": "/audio/dc79ae153136.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Could you write it down for me?", "ko": "적어 주실 수 있을까요?", "a": "/audio/ebfa6e7f1e1c.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Just to make sure, you mean Tuesday?", "ko": "확인차 여쭤볼게요, 화요일 말씀하신 거죠?", "a": "/audio/1533df62dbc0.mp3", "p": "/p/ask-to-repeat/"}, {"en": "So you're saying I need to come back tomorrow?", "ko": "그러니까 내일 다시 와야 한다는 말씀이시죠?", "a": "/audio/c7a4e53071c4.mp3", "p": "/p/ask-to-repeat/"}, {"en": "English isn't my first language, so please bear with me.", "ko": "영어가 모국어가 아니라서 조금만 양해해 주세요.", "a": "/audio/24dbe40d0ffd.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, what time did you say?", "ko": "죄송한데, 몇 시라고 하셨죠?", "a": "/audio/102b9a0dc7da.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, I missed the last part.", "ko": "죄송해요, 마지막 부분을 놓쳤어요.", "a": "/audio/c1cc8265b944.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Which gate was that again?", "ko": "몇 번 게이트라고 하셨죠?", "a": "/audio/3099f4a5c6a8.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Did you say fifteen or fifty?", "ko": "15라고 하셨어요, 50이라고 하셨어요?", "a": "/audio/8181e2187ba7.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Is that one-five or five-zero?", "ko": "1, 5예요, 아니면 5, 0이에요?", "a": "/audio/12c235825766.mp3", "p": "/p/ask-to-repeat/"}, {"en": "Sorry, I didn't catch that.", "ko": "죄송해요, 잘 못 들었어요.", "a": "/audio/1e03778a85b2.mp3", "p": "/p/ask-to-repeat/"}, {"en": "What do you call this in English?", "ko": "이거 영어로 뭐라고 해요?", "a": "/audio/fbec9c56330e.mp3", "p": "/p/what-do-you-call/"}, {"en": "We call it a stapler.", "ko": "그건 스테이플러라고 해요.", "a": "/audio/9558979f2b0e.mp3", "p": "/p/what-do-you-call/"}, {"en": "How do you say this in English?", "ko": "이 말을 영어로 어떻게 해요?", "a": "/audio/dc75b7becbeb.mp3", "p": "/p/what-do-you-call/"}, {"en": "What does \"awkward\" mean?", "ko": "'awkward'가 무슨 뜻이에요?", "a": "/audio/ef71453e6221.mp3", "p": "/p/what-do-you-call/"}, {"en": "How do you spell that?", "ko": "철자가 어떻게 돼요?", "a": "/audio/325e6b0ed31b.mp3", "p": "/p/what-do-you-call/"}, {"en": "What's the word for a person who doesn't eat meat?", "ko": "고기 안 먹는 사람을 뭐라고 하더라?", "a": "/audio/762647b3b168.mp3", "p": "/p/what-do-you-call/"}, {"en": "It's a thing you use to open cans.", "ko": "캔 딸 때 쓰는 그거 있잖아요.", "a": "/audio/26f0a3443504.mp3", "p": "/p/what-do-you-call/"}, {"en": "It's like a small knife, but it folds.", "ko": "작은 칼 같은 건데 접히는 거요.", "a": "/audio/c7eaad8d2cfc.mp3", "p": "/p/what-do-you-call/"}, {"en": "What's the word for it? It's on the tip of my tongue.", "ko": "그걸 뭐라고 하더라? 입에서 맴도는데.", "a": "/audio/19b33fdd5144.mp3", "p": "/p/what-do-you-call/"}, {"en": "Sorry, what do you call this in English?", "ko": "죄송한데, 이거 영어로 뭐라고 해요?", "a": "/audio/352436090f42.mp3", "p": "/p/what-do-you-call/"}, {"en": "A ladle? How do you spell that?", "ko": "레이들이요? 철자가 어떻게 돼요?", "a": "/audio/6a3d4b3ac81b.mp3", "p": "/p/what-do-you-call/"}, {"en": "I'd like to open a bank account.", "ko": "계좌를 개설하고 싶어요.", "a": "/audio/a994ddabd77a.mp3", "p": "/p/id-like-to/"}, {"en": "I'd like to make an appointment.", "ko": "예약하고 싶어요.", "a": "/audio/14abc08231eb.mp3", "p": "/p/id-like-to/"}, {"en": "I'd like a refund, please.", "ko": "환불받고 싶어요.", "a": "/audio/41e8fba56611.mp3", "p": "/p/id-like-to/"}, {"en": "Would you like a receipt?", "ko": "영수증 드릴까요?", "a": "/audio/797026b5be40.mp3", "p": "/p/id-like-to/"}, {"en": "Would you like to leave a message?", "ko": "메시지 남기시겠어요?", "a": "/audio/ebca5f4e0a9e.mp3", "p": "/p/id-like-to/"}, {"en": "I'd like a medium latte, please.", "ko": "라테 미디엄으로 주세요.", "a": "/audio/e1ab36fffbdc.mp3", "p": "/p/id-like-to/"}, {"en": "I'd like to check in, please.", "ko": "체크인하려고요.", "a": "/audio/3a036ad16488.mp3", "p": "/p/id-like-to/"}, {"en": "I'd like to book a table for two at seven.", "ko": "7시에 두 명 자리 예약하고 싶어요.", "a": "/audio/7167c52c204b.mp3", "p": "/p/id-like-to/"}, {"en": "I'd like to speak to the manager, please.", "ko": "매니저와 이야기하고 싶어요.", "a": "/audio/03f05b5030b0.mp3", "p": "/p/id-like-to/"}, {"en": "Hi, I'd like to open a savings account.", "ko": "안녕하세요, 예금 계좌를 하나 만들고 싶어요.", "a": "/audio/e509a7c1cb53.mp3", "p": "/p/id-like-to/"}, {"en": "Yes, I'd like that.", "ko": "네, 그렇게 해 주세요.", "a": "/audio/67035729053f.mp3", "p": "/p/id-like-to/"}, {"en": "Straight for two blocks. Got it.", "ko": "두 블록 직진이요. 알겠어요.", "a": "/audio/18871e346b1b.mp3", "p": "/p/asking-directions/"}, {"en": "Left at the light, right?", "ko": "신호등에서 왼쪽, 맞죠?", "a": "/audio/53c1e4155947.mp3", "p": "/p/asking-directions/"}, {"en": "On my right. Thanks!", "ko": "오른쪽이요. 감사해요!", "a": "/audio/586c9ca307d3.mp3", "p": "/p/asking-directions/"}, {"en": "Ten minutes? Great.", "ko": "10분이요? 좋네요.", "a": "/audio/3d0afd028932.mp3", "p": "/p/asking-directions/"}, {"en": "Great, thank you so much!", "ko": "좋아요, 정말 감사해요!", "a": "/audio/b708ce685130.mp3", "p": "/p/asking-directions/"}, {"en": "Excuse me, how do I get to Central Station?", "ko": "실례지만, 중앙역은 어떻게 가요?", "a": "/audio/7ffcd37155f1.mp3", "p": "/p/asking-directions/"}, {"en": "Is it far from here?", "ko": "여기서 멀어요?", "a": "/audio/8f3621282074.mp3", "p": "/p/asking-directions/"}, {"en": "Could you show me on the map?", "ko": "지도에서 보여 주시겠어요?", "a": "/audio/45aeade590b6.mp3", "p": "/p/asking-directions/"}, {"en": "Is this the right way to the beach?", "ko": "해변 가는 길 이쪽 맞아요?", "a": "/audio/7eed513c7e36.mp3", "p": "/p/asking-directions/"}, {"en": "Where's the nearest restroom?", "ko": "가장 가까운 화장실이 어디예요?", "a": "/audio/f478149bff18.mp3", "p": "/p/asking-directions/"}, {"en": "Thank you so much!", "ko": "정말 감사해요!", "a": "/audio/a20c2f452119.mp3", "p": "/p/asking-directions/"}, {"en": "Sorry, left or right?", "ko": "죄송한데, 왼쪽이요, 오른쪽이요?", "a": "/audio/5921140c618f.mp3", "p": "/p/asking-directions/"}, {"en": "The pharmacy is across from the post office.", "ko": "약국은 우체국 맞은편에 있어요.", "a": "/audio/3489d4beeab3.mp3", "p": "/p/asking-directions/"}, {"en": "Keep going past the church, and it's on the corner.", "ko": "교회를 지나 계속 가면 모퉁이에 있어요.", "a": "/audio/05d5b2f7fcb8.mp3", "p": "/p/asking-directions/"}, {"en": "Is it on this side of the street?", "ko": "길 이쪽 편에 있어요?", "a": "/audio/c28ff2bd1705.mp3", "p": "/p/asking-directions/"}, {"en": "Should I turn at the second light?", "ko": "두 번째 신호등에서 꺾으면 돼요?", "a": "/audio/e6419e2f272d.mp3", "p": "/p/asking-directions/"}, {"en": "Is there a landmark I can look for?", "ko": "찾을 때 눈에 띄는 건물이 있을까요?", "a": "/audio/9b6537ee832b.mp3", "p": "/p/asking-directions/"}, {"en": "So I go back the way I came?", "ko": "그럼 왔던 길로 돌아가면 돼요?", "a": "/audio/2e16f30db523.mp3", "p": "/p/asking-directions/"}, {"en": "I'm just looking, thanks.", "ko": "그냥 둘러보는 거예요.", "a": "/audio/67378a34845a.mp3", "p": "/p/shopping-checkout/"}, {"en": "Sure, where's the fitting room?", "ko": "네, 피팅룸이 어디예요?", "a": "/audio/b37389b163bb.mp3", "p": "/p/shopping-checkout/"}, {"en": "Yes, thanks.", "ko": "네, 감사해요.", "a": "/audio/77539deb55dc.mp3", "p": "/p/shopping-checkout/"}, {"en": "No bag, thanks.", "ko": "봉투는 괜찮아요.", "a": "/audio/4d877218612b.mp3", "p": "/p/shopping-checkout/"}, {"en": "Credit, please.", "ko": "신용카드요.", "a": "/audio/5d6566becae4.mp3", "p": "/p/shopping-checkout/"}, {"en": "Can I try this on?", "ko": "이거 입어 봐도 돼요?", "a": "/audio/146285a938a0.mp3", "p": "/p/shopping-checkout/"}, {"en": "Do you have this in a smaller size?", "ko": "이거 더 작은 사이즈 있어요?", "a": "/audio/0c6bfd361358.mp3", "p": "/p/shopping-checkout/"}, {"en": "Can I get a tax refund?", "ko": "세금 환급 받을 수 있어요?", "a": "/audio/e4a1550212a6.mp3", "p": "/p/shopping-checkout/"}, {"en": "Thank you!", "ko": "감사합니다!", "a": "/audio/d44736082607.mp3", "p": "/p/shopping-checkout/"}, {"en": "Sorry, how much was that?", "ko": "죄송한데, 얼마라고 하셨죠?", "a": "/audio/2ff3520643ee.mp3", "p": "/p/shopping-checkout/"}, {"en": "I'd like to return this.", "ko": "이거 반품하고 싶어요.", "a": "/audio/649009cd902b.mp3", "p": "/p/shopping-checkout/"}, {"en": "Can I exchange this for a different size?", "ko": "다른 사이즈로 교환할 수 있어요?", "a": "/audio/cd15afdf1605.mp3", "p": "/p/shopping-checkout/"}, {"en": "I think I was charged twice.", "ko": "두 번 결제된 것 같아요.", "a": "/audio/1b7f49d3a7c2.mp3", "p": "/p/shopping-checkout/"}, {"en": "It was a gift, so I don't have the receipt.", "ko": "선물받은 거라 영수증이 없어요.", "a": "/audio/8fe05b603e29.mp3", "p": "/p/shopping-checkout/"}, {"en": "Do you have this in another color?", "ko": "이거 다른 색도 있어요?", "a": "/audio/0caeb03056a9.mp3", "p": "/p/shopping-checkout/"}, {"en": "I'd like to return these shoes.", "ko": "이 신발 반품하고 싶어요.", "a": "/audio/27c539c48284.mp3", "p": "/p/shopping-checkout/"}, {"en": "I have a headache.", "ko": "머리가 아파요.", "a": "/audio/734b1e8fc676.mp3", "p": "/p/doctor/"}, {"en": "I have a sore throat.", "ko": "목이 아파요.", "a": "/audio/e4bcc23ed230.mp3", "p": "/p/doctor/"}, {"en": "I have a fever.", "ko": "열이 나요.", "a": "/audio/cb7c52a8c331.mp3", "p": "/p/doctor/"}, {"en": "I have a runny nose.", "ko": "콧물이 나요.", "a": "/audio/4ee590f930a1.mp3", "p": "/p/doctor/"}, {"en": "I have a stomachache.", "ko": "배가 아파요.", "a": "/audio/bb11e31a3747.mp3", "p": "/p/doctor/"}, {"en": "I've been coughing for three days.", "ko": "사흘째 기침이 나요.", "a": "/audio/7443cd1298f8.mp3", "p": "/p/doctor/"}, {"en": "It started yesterday.", "ko": "어제부터 시작됐어요.", "a": "/audio/63aa9b6f6363.mp3", "p": "/p/doctor/"}, {"en": "It hurts here.", "ko": "여기가 아파요.", "a": "/audio/184d0c2616f9.mp3", "p": "/p/doctor/"}, {"en": "It hurts when I swallow.", "ko": "삼킬 때 아파요.", "a": "/audio/b6d6c3862af7.mp3", "p": "/p/doctor/"}, {"en": "Do I need a prescription for this?", "ko": "이거 처방전이 필요한가요?", "a": "/audio/47ca3ab5c04d.mp3", "p": "/p/doctor/"}, {"en": "I'm allergic to penicillin.", "ko": "페니실린 알레르기가 있어요.", "a": "/audio/18117d91e82a.mp3", "p": "/p/doctor/"}, {"en": "How often should I take this?", "ko": "이거 얼마나 자주 먹어야 해요?", "a": "/audio/5fed7f31e7f8.mp3", "p": "/p/doctor/"}, {"en": "I've had a sore throat and a fever since Monday.", "ko": "월요일부터 목이 아프고 열이 나요.", "a": "/audio/1f0e88dce493.mp3", "p": "/p/doctor/"}, {"en": "Just some cold medicine. And I'm allergic to penicillin.", "ko": "감기약만 조금요. 그리고 페니실린 알레르기가 있어요.", "a": "/audio/d619cb2ed4b6.mp3", "p": "/p/doctor/"}, {"en": "Take one tablet twice a day.", "ko": "하루 두 번, 한 알씩 드세요.", "a": "/audio/e757ee5c72ba.mp3", "p": "/p/doctor/"}, {"en": "Take it with food.", "ko": "식사와 함께 드세요.", "a": "/audio/3941c07962d8.mp3", "p": "/p/doctor/"}, {"en": "It may cause drowsiness.", "ko": "졸릴 수 있어요.", "a": "/audio/50c8f0f7428e.mp3", "p": "/p/doctor/"}, {"en": "Do not take more than four in 24 hours.", "ko": "24시간 동안 네 알 넘게 드시면 안 돼요.", "a": "/audio/88a965581b28.mp3", "p": "/p/doctor/"}, {"en": "Are you free this Friday?", "ko": "이번 주 금요일에 시간 돼?", "a": "/audio/6d06919520f0.mp3", "p": "/p/this-vs-next/"}, {"en": "Let's meet next Friday.", "ko": "다음 주 금요일에 만나자.", "a":
