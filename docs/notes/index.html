 "/audio/e82962eb9049.mp3", "p": "/p/this-vs-next/"}, {"en": "Do you mean this Friday or next Friday?", "ko": "이번 주 금요일 말하는 거야, 다음 주 금요일 말하는 거야?", "a": "/audio/cc10ef8f4c89.mp3", "p": "/p/this-vs-next/"}, {"en": "How about Friday the 16th?", "ko": "16일 금요일 어때요?", "a": "/audio/2b661ce251b9.mp3", "p": "/p/this-vs-next/"}, {"en": "Let's do Friday, October 23rd.", "ko": "10월 23일 금요일로 하죠.", "a": "/audio/eeb39edacc3b.mp3", "p": "/p/this-vs-next/"}, {"en": "I'll see you a week from Friday.", "ko": "이번 금요일에서 일주일 뒤에 봐요.", "a": "/audio/7f050b2fa7cc.mp3", "p": "/p/this-vs-next/"}, {"en": "I saw her this past Friday.", "ko": "지난 금요일에 그 친구 봤어.", "a": "/audio/88e85018a4a2.mp3", "p": "/p/this-vs-next/"}, {"en": "Let's meet the Friday after next.", "ko": "다다음 주 금요일에 만나자.", "a": "/audio/82434673e524.mp3", "p": "/p/this-vs-next/"}, {"en": "Are you free this weekend?", "ko": "이번 주말에 시간 돼?", "a": "/audio/af9d87ab70df.mp3", "p": "/p/this-vs-next/"}, {"en": "I mean the weekend after this one.", "ko": "이번 주말 말고 그다음 주말 말하는 거야.", "a": "/audio/913ac4db751a.mp3", "p": "/p/this-vs-next/"}, {"en": "Sure. Just to confirm, is that the 20th?", "ko": "좋아요. 확인차 여쭤보는데, 20일 말씀하시는 거죠?", "a": "/audio/1f9ae1459cb4.mp3", "p": "/p/this-vs-next/"}, {"en": "Great. I'll put it on my calendar.", "ko": "좋아요. 캘린더에 넣어 둘게요.", "a": "/audio/d55a5cbe66bd.mp3", "p": "/p/this-vs-next/"}, {"en": "Hi Jenny,", "ko": "안녕하세요 제니,", "a": "/audio/16b692768f70.mp3", "p": "/p/email-phrases/"}, {"en": "I hope you're doing well.", "ko": "잘 지내시죠?", "a": "/audio/397a66777904.mp3", "p": "/p/email-phrases/"}, {"en": "Thanks for getting back to me.", "ko": "답장 주셔서 감사해요.", "a": "/audio/2a973e426299.mp3", "p": "/p/email-phrases/"}, {"en": "I'm writing to ask about the schedule.", "ko": "일정 관련해서 여쭤보려고 메일 드려요.", "a": "/audio/2b9f5ef9df13.mp3", "p": "/p/email-phrases/"}, {"en": "Just following up on my last email.", "ko": "지난번 메일 관련해서 다시 연락드려요.", "a": "/audio/db0c6533a416.mp3", "p": "/p/email-phrases/"}, {"en": "I've attached the file.", "ko": "파일 첨부했어요.", "a": "/audio/cfcebabd1a25.mp3", "p": "/p/email-phrases/"}, {"en": "Let me know if you have any questions.", "ko": "궁금한 점 있으면 알려 주세요.", "a": "/audio/c5d8109899e9.mp3", "p": "/p/email-phrases/"}, {"en": "Thanks in advance.", "ko": "미리 감사드려요.", "a": "/audio/2ce9c04725d4.mp3", "p": "/p/email-phrases/"}, {"en": "Sorry for the late reply.", "ko": "답장이 늦어서 죄송해요.", "a": "/audio/45856e9f49b6.mp3", "p": "/p/email-phrases/"}, {"en": "Would Thursday afternoon work for you?", "ko": "목요일 오후 괜찮으세요?", "a": "/audio/b9ef822d19d4.mp3", "p": "/p/email-phrases/"}, {"en": "Could you confirm by Friday?", "ko": "금요일까지 확인해 주실 수 있을까요?", "a": "/audio/8eaab5cbf303.mp3", "p": "/p/email-phrases/"}, {"en": "Just a quick reminder that the deadline is tomorrow.", "ko": "마감이 내일이라 한 번 더 말씀드려요.", "a": "/audio/18b00b512e35.mp3", "p": "/p/email-phrases/"}, {"en": "Meeting schedule for next week", "ko": "다음 주 회의 일정", "a": "/audio/8a84da03e0b0.mp3", "p": "/p/email-phrases/"}, {"en": "Question about the invoice", "ko": "청구서 관련 문의", "a": "/audio/b8026cfea0ae.mp3", "p": "/p/email-phrases/"}, {"en": "Quick question", "ko": "간단한 질문", "a": "/audio/1ea5ffd8cc82.mp3", "p": "/p/email-phrases/"}, {"en": "Can you open the window?", "ko": "창문 좀 열어 줄래?", "a": "/audio/3ef6e0c9295a.mp3", "p": "/p/would-you-mind/"}, {"en": "Could you open the window?", "ko": "창문 좀 열어 주시겠어요?", "a": "/audio/7bf6fbc52ed1.mp3", "p": "/p/would-you-mind/"}, {"en": "Would you mind opening the window?", "ko": "창문 좀 열어 주실 수 있을까요?", "a": "/audio/ff027fad18bf.mp3", "p": "/p/would-you-mind/"}, {"en": "Would you mind closing the door? Not at all.", "ko": "문 좀 닫아 주실래요? 그럼요.", "a": "/audio/95baf39ddabe.mp3", "p": "/p/would-you-mind/"}, {"en": "Do you mind if I sit here? No, go ahead.", "ko": "여기 앉아도 될까요? 그럼요, 앉으세요.", "a": "/audio/c1e313612f41.mp3", "p": "/p/would-you-mind/"}, {"en": "Excuse me, would you mind switching seats with me?", "ko": "실례지만 저랑 자리 좀 바꿔 주실 수 있을까요?", "a": "/audio/c7c28cb3f79e.mp3", "p": "/p/would-you-mind/"}, {"en": "Yes, we got separated. Thank you so much.", "ko": "네, 자리가 떨어져서요. 정말 감사해요.", "a": "/audio/bf6e9c6f8d34.mp3", "p": "/p/would-you-mind/"}, {"en": "Sorry, I'd rather keep it closed. I'm a bit cold.", "ko": "죄송한데 닫아 두고 싶어요. 좀 추워서요.", "a": "/audio/89f2fca3487c.mp3", "p": "/p/would-you-mind/"}, {"en": "Actually, I'd prefer if you didn't. Sorry about that.", "ko": "사실 안 하셨으면 좋겠어요. 죄송해요.", "a": "/audio/af7a44273bbc.mp3", "p": "/p/would-you-mind/"}, {"en": "I was wondering if you could help me with this.", "ko": "혹시 이것 좀 도와주실 수 있을까 해서요.", "a": "/audio/f35a3b065266.mp3", "p": "/p/would-you-mind/"}, {"en": "Would it be possible to change my seat?", "ko": "자리를 바꿀 수 있을까요?", "a": "/audio/8337ff790f7c.mp3", "p": "/p/would-you-mind/"}, {"en": "I lost my wallet.", "ko": "지갑을 잃어버렸어요.", "a": "/audio/a36fb4862686.mp3", "p": "/p/travel-trouble/"}, {"en": "I don't feel well.", "ko": "몸이 안 좋아요.", "a": "/audio/d2fa9fb5e929.mp3", "p": "/p/travel-trouble/"}, {"en": "I think I left it in the taxi.", "ko": "택시에 두고 내린 것 같아요.", "a": "/audio/7efaf267b298.mp3", "p": "/p/travel-trouble/"}, {"en": "Can you put me on the next flight?", "ko": "다음 항공편으로 바꿔 주실 수 있어요?", "a": "/audio/a0b1cf71bc2f.mp3", "p": "/p/travel-trouble/"}, {"en": "Yes, I do.", "ko": "네, 있어요.", "a": "/audio/06b0f7856558.mp3", "p": "/p/travel-trouble/"}, {"en": "Please call an ambulance.", "ko": "구급차 좀 불러 주세요.", "a": "/audio/f2d0b7535a4e.mp3", "p": "/p/travel-trouble/"}, {"en": "I need a police report for my insurance.", "ko": "보험 때문에 경찰 확인서가 필요해요.", "a": "/audio/1cdcec311b9d.mp3", "p": "/p/travel-trouble/"}, {"en": "Yes, here it is. Thank you so much.", "ko": "네, 여기요. 정말 감사해요.", "a": "/audio/b84712598edb.mp3", "p": "/p/travel-trouble/"}, {"en": "I need help, please.", "ko": "도와주세요.", "a": "/audio/5a42072ab818.mp3", "p": "/p/travel-trouble/"}, {"en": "My bag was stolen.", "ko": "가방을 도둑맞았어요.", "a": "/audio/038fa66d8b8f.mp3", "p": "/p/travel-trouble/"}, {"en": "Someone took my phone from my pocket.", "ko": "누가 주머니에서 폰을 가져갔어요.", "a": "/audio/d9920c4c66ef.mp3", "p": "/p/travel-trouble/"}, {"en": "It happened about ten minutes ago.", "ko": "10분쯤 전에 그랬어요.", "a": "/audio/4a5e7b6af905.mp3", "p": "/p/travel-trouble/"}, {"en": "It's a black leather wallet.", "ko": "검은색 가죽 지갑이에요.", "a": "/audio/cb7f8253e668.mp3", "p": "/p/travel-trouble/"}, {"en": "I need to cancel my credit cards.", "ko": "신용카드를 정지해야 해요.", "a": "/audio/d744412011cb.mp3", "p": "/p/travel-trouble/"}, {"en": "I lost it somewhere around the market.", "ko": "시장 근처 어딘가에서 잃어버렸어요.", "a": "/audio/4b39e88ecb8a.mp3", "p": "/p/travel-trouble/"}, {"en": "Can you hear me okay?", "ko": "제 목소리 잘 들리세요?", "a": "/audio/2a2166929e2d.mp3", "p": "/p/video-call/"}, {"en": "You're on mute.", "ko": "음소거 되어 있어요.", "a": "/audio/6ff2a890a8cb.mp3", "p": "/p/video-call/"}, {"en": "You're breaking up.", "ko": "소리가 끊겨요.", "a": "/audio/201945180770.mp3", "p": "/p/video-call/"}, {"en": "Can you see my screen?", "ko": "제 화면 보이세요?", "a": "/audio/6e8288b09251.mp3", "p": "/p/video-call/"}, {"en": "Sorry, go ahead.", "ko": "죄송해요, 먼저 말씀하세요.", "a": "/audio/d83c70e0cbe1.mp3", "p": "/p/video-call/"}, {"en": "Sorry, I have a hard stop at three.", "ko": "죄송해요, 3시에는 꼭 나가야 해요.", "a": "/audio/48bb717b6a68.mp3", "p": "/p/video-call/"}, {"en": "Let's pick this up next time.", "ko": "이건 다음에 이어서 해요.", "a": "/audio/a73f0260dc32.mp3", "p": "/p/video-call/"}, {"en": "Yes, loud and clear.", "ko": "네, 아주 잘 들려요.", "a": "/audio/1df35c19e48d.mp3", "p": "/p/video-call/"}, {"en": "Oh, sorry! Can you hear me now?", "ko": "앗, 죄송해요! 이제 들리세요?", "a": "/audio/50b4caebe3db.mp3", "p": "/p/video-call/"}, {"en": "Can I jump in here for a second?", "ko": "잠깐 한마디 해도 될까요?", "a": "/audio/4ee14db70831.mp3", "p": "/p/video-call/"}, {"en": "Sorry, could you repeat the last part?", "ko": "죄송한데 마지막 부분 다시 말씀해 주시겠어요?", "a": "/audio/17a29652aa70.mp3", "p": "/p/video-call/"}, {"en": "I'll drop the link in the chat.", "ko": "링크는 채팅창에 올릴게요.", "a": "/audio/93eacfa14a3b.mp3", "p": "/p/video-call/"}, {"en": "Let's wrap up here.", "ko": "여기서 마무리하죠.", "a": "/audio/01cf9beb740c.mp3", "p": "/p/video-call/"}, {"en": "Sorry, I missed that. Could you say it again?", "ko": "죄송해요, 놓쳤어요. 다시 말씀해 주시겠어요?", "a": "/audio/3454932e769c.mp3", "p": "/p/video-call/"}, {"en": "I need to hop off a few minutes early today.", "ko": "오늘은 몇 분 일찍 나가 봐야 해요.", "a": "/audio/7ae22dff01c7.mp3", "p": "/p/video-call/"}]}, "goals": [{"id": "talk", "name": "일상 대화 영어", "short": "일상 대화", "icon": "/assets/icons/speech-balloon.webp?v=41bad4f2"}, {"id": "travel", "name": "해외여행 영어", "short": "여행", "icon": "/assets/icons/airplane.webp?v=41bad4f2"}, {"id": "work", "name": "회사 영어", "short": "회사", "icon": "/assets/icons/laptop.webp?v=41bad4f2"}, {"id": "life", "name": "해외 생활 영어", "short": "해외 생활", "icon": "/assets/icons/world-map.webp?v=41bad4f2"}], "qa": {"We invest first and foremost in relationships.": "/audio/93f0743d8c56.mp3", "We don't just come to build a plant. We come to put down roots.": "/audio/bb19f7b438eb.mp3", "We come to stay, to invest, and to grow together.": "/audio/404875842a38.mp3", "You are contributing to something that is, like every vehicle, greater than the sum of its parts. You are Hyundai.": "/audio/b08b36bddb57.mp3", "First, both of our companies are all in on AI.": "/audio/ff08887afc87.mp3", "I'm sorry to break it to you. You're going to live forever.": "/audio/f1d18dd18a38.mp3", "Can you make it faster?": "/audio/c48aeebdf43d.mp3", "Nvidia designs the brain, and SK builds the memory. Nvidia thinks lightning fast, and SK makes sure it never forgets.": "/audio/13164e0963a4.mp3", "I have to admit, I'm rather uncomfortable with all this attention.": "/audio/5e4ae41b7c3d.mp3", "It was the first time I heard the name of the company I helped create chanted out loud, and it took my breath away.": "/audio/65248d1fda6b.mp3", "Ladies and gentlemen, this is a Samsung Galaxy, the brightest phone in the world.": "/audio/8c7983972cd3.mp3", "Well, no company, no people are better at building factories than Koreans. And now you are building the factory of intelligence.": "/audio/2677498f1efd.mp3", "You got to be sincere.": "/audio/52fe9d3d09ef.mp3", "Because you won't be able to follow up on that. And that's the important part of conversation.": "/audio/1f998d6ae093.mp3", "When people know you're being real, they're generally more honest and open with you as well.": "/audio/caa100dfd5b0.mp3", "The whole thing here is to open the door to start a conversation.": "/audio/77c800844641.mp3", "It doesn't matter how good you are as a footballer.": "/audio/0c86f39d49d3.mp3", "Stay humble, be nice, help the people.": "/audio/eaa0f5c5116c.mp3", "Say hello first. Sometimes it's easy, but sometimes the easiest thing is the hardest.": "/audio/83e063e52146.mp3", "I haven't reached my dream yet. There's still room to improve.": "/audio/a33cca634647.mp3", "That was my view of America: not easy, but full of opportunities; not a guarantee, but a chance.": "/audio/161a38e6dc90.mp3", "I learned early that being CEO is not about power, but the responsibility that comes with keeping the company alive.": "/audio/2db93daeb271.mp3", "We learned never to see failure as the opposite of success.": "/audio/11c981455071.mp3", "The resilience forged through setbacks is what gives you the strength to go again.": "/audio/219d32d8d9f2.mp3", "For the first time, I realized the world won't end if I relaxed a little.": "/audio/59053c320d73.mp3", "We don't get to choose the world we graduate into, but we do get to choose how we frame our circumstances.": "/audio/e211baad7907.mp3", "We prefer to call it golden.": "/audio/7dbc8cf7fac8.mp3", "The important thing isn't to get them all right, it's to find a way to keep moving forward.": "/audio/68910c464707.mp3"}, "cup": "/assets/icons/hot-beverage.webp?v=41bad4f2", "phone": "/assets/icons/mobile-phone.webp?v=41bad4f2"}</script>
